// ---------- drag tiles ----------
let suppressClick=false;
function bindDrag(){
  const box=document.getElementById("gans");if(!box)return;
  const card=box.closest(".gcard");
  card.querySelectorAll(".tile[data-place],.tile[data-unplace]").forEach(el=>{
    if(el.classList.contains("used"))return;
    let sx=0,sy=0,pid=null,drag=null;
    el.addEventListener("pointerdown",e=>{if(e.button>0)return;sx=e.clientX;sy=e.clientY;pid=e.pointerId;drag=null;try{el.setPointerCapture(pid)}catch(_){}});
    el.addEventListener("pointermove",e=>{
      if(pid!==e.pointerId)return;
      if(!drag){if(Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;
        const f=el.cloneNode(true);f.classList.add("dragfloat");f.removeAttribute("data-place");f.removeAttribute("data-unplace");document.body.appendChild(f);
        const caret=document.createElement("div");caret.className="caret";box.appendChild(caret);
        el.classList.add("ghosting");drag={f,caret,pos:null}}
      drag.f.style.left=e.clientX+"px";drag.f.style.top=e.clientY+"px";
      const r=box.getBoundingClientRect(),inside=e.clientX>=r.left-24&&e.clientX<=r.right+24&&e.clientY>=r.top-24&&e.clientY<=r.bottom+24;
      box.classList.toggle("drop",inside);
      if(!inside){drag.pos=null;drag.caret.style.display="none";return}
      const items=[...box.querySelectorAll(".tile[data-unplace]")].filter(x=>x!==el);
      let pos=items.length,target=null;
      for(let i=0;i<items.length;i++){const q=items[i].getBoundingClientRect();if(e.clientY<q.top||(e.clientY<=q.bottom&&e.clientX<q.left+q.width/2)){pos=i;target=q;break}}
      drag.pos=pos;drag.caret.style.display="block";
      let q=target,x;if(q)x=q.left-r.left-6;else if(items.length){q=items[items.length-1].getBoundingClientRect();x=q.right-r.left+3}else{q={top:r.top+12,height:38};x=12}
      drag.caret.style.left=x+"px";drag.caret.style.top=(q.top-r.top)+"px";drag.caret.style.height=q.height+"px";
    });
    const finish=e=>{
      if(pid!==e.pointerId)return;pid=null;
      if(!drag)return;
      suppressClick=e.type==="pointerup";drag.f.remove();drag.caret.remove();box.classList.remove("drop");
      const c=gs.cur,pos=drag.pos;drag=null;
      if(el.dataset.unplace!==undefined){
        const i=Number(el.dataset.unplace),k=c.placed[i],rest=c.placed.slice(0,i).concat(c.placed.slice(i+1));
        if(pos===null)c.placed=rest;else{rest.splice(pos,0,k);c.placed=rest}
      }else if(pos!==null){const k=Number(el.dataset.place);if(!c.placed.includes(k))c.placed.splice(pos,0,k)}
      c.err=null;render();setTimeout(()=>{suppressClick=false},0);
    };
    el.addEventListener("pointerup",finish);el.addEventListener("pointercancel",finish);
  });
}

function series(range){
  const t=today(),T=S.time,out=[];
  if(range==="d"){for(let i=13;i>=0;i--){const d=addDays(t,-i),x=T[d]||{};out.push({l:md(d),v:x.v||0,g:x.g||0})}return out}
  if(range==="w"){
    const now=parseD(t);const dow=(now.getDay()+6)%7;const mon=addDays(t,-dow);
    for(let i=11;i>=0;i--){const s=addDays(mon,-7*i);let v=0,g=0;for(let j=0;j<7;j++){const x=T[addDays(s,j)];if(x){v+=x.v||0;g+=x.g||0}}out.push({l:md(s),v,g})}
    return out;
  }
  if(range==="m"){
    const now=parseD(t);
    for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const key=d.getFullYear()+"-"+pad(d.getMonth()+1);let v=0,g=0;for(const k in T)if(k.startsWith(key)){v+=T[k].v||0;g+=T[k].g||0}out.push({l:(d.getMonth()+1)+"月",v,g})}
    return out;
  }
  const y0=Number(t.slice(0,4));
  for(let y=y0-4;y<=y0;y++){let v=0,g=0;for(const k in T)if(k.startsWith(y+"-")){v+=T[k].v||0;g+=T[k].g||0}out.push({l:String(y),v,g})}
  return out;
}

}

    return h;
  }
  const du=dueOn(ds),fi=finishInfo(),nw=fi.finish&&ds<=fi.finish&&ds>=fi.start?cnt():0;
  h+='<p style="font-size:13px;color:var(--muted);margin:0 0 8px">'+(nw?"預計 "+nw+" 個新字（當天隨機抽）":"沒有排新字")+(du.length?"，加上 "+du.length+" 個生詞複習":"")+'</p>';
  if(du.length)h+='<div class="list">'+du.map(id=>wordItem(byId(id),lvl(S.p[id].b))).join("")+'</div>';
  return h;
}

// iPhone home-screen apps sometimes report a viewport that is shorter than the screen by the status-bar height
// (only on pages that do not scroll), which lifted the tab bar. Size the app to the real screen height instead.
let fitMax=0;
function fitNav(){
  let h=window.innerHeight;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  if(ios){
    const portrait=matchMedia("(orientation: portrait)").matches;
    const sh=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
    if(sh>h&&sh-h<=70)h=sh;
    // never shrink later in the same orientation (iOS reports a shorter height ~0.5s after launch)
    const key=portrait?1:2;if(fitMax&&fitMax.k===key&&fitMax.h>h&&fitMax.h-h<=70)h=fitMax.h;fitMax={k:key,h};
  }
  document.documentElement.style.setProperty("--apph",h+"px");
  if(window.scrollY||document.documentElement.scrollTop)window.scrollTo(0,0);
}
addEventListener("resize",fitNav);addEventListener("orientationchange",()=>{fitMax=0;setTimeout(fitNav,300)});fitNav();
// iOS may scroll the whole document a little after launch; keep it pinned
addEventListener("scroll",()=>{if(window.scrollY)window.scrollTo(0,0)},{passive:true});
if(window.visualViewport)visualViewport.addEventListener("resize",fitNav);
[100,300,600,1000,2000].forEach(t=>setTimeout(fitNav,t));
// no pinch / double-tap zoom anywhere
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
["touchstart","touchmove"].forEach(ev=>document.addEventListener(ev,e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false}));
// auto-update: phones keep an old copy of the page for a while, so ask the site for the newest version number
// and reload with a fresh address when it changed (at most once per new version)
let updChecking=false;
async function checkUpdate(){
  if(!STANDALONE||location.protocol!=="https:"||updChecking)return;updChecking=true;
  try{
    const r=await fetch("index.html?check="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VER="([^"]+)"/);
    if(m&&m[1]!==APP_VER){
      const k="daily-english-upd-"+m[1];let tried=false;try{tried=sessionStorage.getItem(k)==="1";sessionStorage.setItem(k,"1")}catch(_){}
      if(!tried){try{flush()}catch(_){}setTimeout(()=>location.replace(location.pathname+"?v="+encodeURIComponent(m[1])),300)}
    }
  }catch(_){}finally{updChecking=false}
}
setTimeout(checkUpdate,1500);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
function toTop(){const v=document.getElementById("view");if(v)v.scrollTop=0}

// ---------- swipe ----------
// swipe in any direction: only left vs right matters, so a mostly-vertical swipe that leans left counts as left
function bindCard(){
  const c=document.getElementById("card");if(!c)return;
  const sk=document.getElementById("stk"),su=document.getElementById("stu");
  let x0=null,y0=0,dx=0,dy=0,pid=null,moved=false;
  c.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;x0=e.clientX;y0=e.clientY;dx=dy=0;moved=false;pid=e.pointerId;c.classList.remove("anim","flipin");try{c.setPointerCapture(pid)}catch(_){}});
  c.addEventListener("pointermove",e=>{if(x0===null||e.pointerId!==pid)return;dx=e.clientX-x0;dy=e.clientY-y0;
    if(!moved&&Math.hypot(dx,dy)>10)moved=true;
    if(!moved)return;c.style.transform="translateX("+dx+"px) rotate("+(dx/18)+"deg)";
    const a=Math.abs(dx)<4?0:Math.min(1,Math.hypot(dx,dy)/90);sk.style.opacity=dx>0?a:0;su.style.opacity=dx<0?a:0});
  const end=e=>{if(x0===null||e.pointerId!==pid)return;x0=null;
    if(moved&&Math.hypot(dx,dy)>70&&Math.abs(dx)>=4){fly(dx>0?"k":"u");return}
    c.classList.add("anim");c.style.transform="";sk.style.opacity=0;su.style.opacity=0;
    if(!moved&&e.type==="pointerup")flip()};
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}
function flip(){flipped=!flipped;justFlipped=true;const w=currentCard();if(flipped&&S.settings.auto&&w)speak(w.en);render()}
function fly(r){
  const c=document.getElementById("card");if(!c){answer(r);render();return}
  (r==="k"?document.getElementById("stk"):document.getElementById("stu")).style.opacity=1;
  c.classList.add("anim");c.style.transform="translateX("+(r==="k"?140:-140)+"%) rotate("+(r==="k"?18:-18)+"deg)";c.style.opacity="0";
  const g=document.querySelector(".card.ghost");if(g){g.classList.add("anim");g.style.transform="none";g.style.opacity="1"}
  setTimeout(()=>{answer(r);render()},matchMedia("(prefers-reduced-motion: reduce)").matches?0:220);
}

// ---------- cloud sync ----------
async function loadRemote(){
  if(!col)return;
  try{
    const qs=await col.get();const docs={};qs.docs.forEach(d=>{if(d.exists)docs[d.id]=d.data()});
    let remote=null;
    if(docs.meta)remote=assemble(docs);
    else if(docs.flashcards)remote=normalize(JSON.parse(JSON.stringify(docs.flashcards)));
    if(remote&&(remote.u||0)>(S.u||0)){
      S=remote;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
      if(docs.meta)markWritten();else{lastWritten={};flush()}
      _idxN=-1;render();
    }else if(S.u){lastWritten={};flush()}
    setSync("ok");
  }catch(e){setSync("local")}
}
// ---------- Google login (standalone build only) ----------
function readLS(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(_){return null}}
function switchStore(key){LS=key;S=normalize(readLS(key)||{});lastWritten={};_idxN=-1;mode="daily";sess=null;quiz=null;gs=null;undoSnap=null}
function fbReady(){return !!(window.FIREBASE_CONFIG&&window.firebase&&firebase.apps&&firebase.apps.length)}
function fbLogin(){
  if(!fbReady()){toast("還沒設定 Google 登入");return}
  const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});
  firebase.auth().signInWithPopup(pr).catch(e=>{const c=e.code||"";if(/popup-blocked|operation-not-supported|web-storage/.test(c))firebase.auth().signInWithRedirect(pr);else if(!/popup-closed|cancelled-popup/.test(c))toast("登入失敗："+c)});
}
function fbLogout(){if(fbReady()){flush();setLastUid("");firebase.auth().signOut()}}
function initFirebase(){
  if(!window.FIREBASE_CONFIG||!window.firebase){setSync("local");return}
  try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){setSync("local");toast("Google 登入設定有誤");return}
  const fs=firebase.firestore();
  firebase.auth().getRedirectResult().catch(e=>toast("登入失敗："+(e.code||"")));
  let nullTimer=null;
  const applyUser=async u=>{
    fbUser=u;fbAuthKnown=true;
    if(u){
      setLastUid(u.uid);
      if(LS!=="daily-english-"+u.uid)switchStore("daily-english-"+u.uid);
      col=fs.collection("users").doc(u.uid).collection("data");
      await loadRemote();
      // progress made before the first login moves into this account once
      const loc=readLS("daily-english-local");
      if(loc&&loc.u){mergeIn({S:loc});try{localStorage.removeItem("daily-english-local")}catch(_){}}
    }else{col=null;switchStore("daily-english-local");setSync("login")}
    render();
  };
  firebase.auth().onAuthStateChanged(u=>{
    clearTimeout(nullTimer);
    // iPhone home-screen apps sometimes report "logged out" for a moment before the saved login loads
    if(!u&&lastUid()){nullTimer=setTimeout(()=>{const cu=firebase.auth().currentUser;if(cu)applyUser(cu);else{setLastUid("");applyUser(null)}},4000);return}
    applyUser(u);
  });
}

(async()=>{
  if(STANDALONE&&lastUid())switchStore("daily-english-"+lastUid());
  render();
  if(STANDALONE){initFirebase();return}
  try{
    if(!window.claude||!claude.use){setSync("local");return}
    const[d,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!d||!uid){setSync("local");return}
    col=d.collection("data/users/"+uid);
    await loadRemote();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!saveTimer)loadRemote()});
  }catch(e){setSync("local")}
})();
