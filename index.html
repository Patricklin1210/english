<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日英文">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>每日英文</title>
<style>:root{padding:0!important}body{margin:0;position:fixed!important;top:0;left:0;right:0;height:var(--apph,100%)!important;padding-top:env(safe-area-inset-top,0px)!important;padding-bottom:0!important}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.STANDALONE_BUILD=true</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Single deep-navy theme on purpose (the owner asked for it). Layout: one narrow column like a phone app; card stage is the hero, five tabs pinned to the bottom. */
:root{
  --bg:#0d1a2f; --surface:#15253f; --surface-2:#1c2f4f; --ink:#e9eff8; --muted:#9db0cc; --line:#2a3f63;
  --accent:#6fa8ff; --accent-ink:#0d1a2f; --accent-soft:#23395e;
  --know:#4fd1a1; --know-bg:#143a37; --unk:#f6a560; --unk-bg:#3d2c1f;
  --gram:#f08cc4; --heart:#ff7aa8;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
  --f-display:"Archivo","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;touch-action:pan-x pan-y}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;height:var(--apph,100%);box-sizing:border-box;overflow:hidden;overscroll-behavior:none}
body{height:100%;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:0;padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{flex:1;min-height:0;width:100%;max-width:572px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px}
#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding-bottom:14px}
#view.fill{display:flex;flex-direction:column;overflow:hidden;padding-bottom:8px}
#view.fill .stage{flex:1;height:auto;max-height:none;min-height:220px}
#view.fill .actions{margin-top:10px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--know)} .sync.local i{background:var(--unk)}
.timebar{display:flex;gap:14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-bottom:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.timebar b{font-weight:500;color:var(--ink)}
.timebar .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.timebar .on{color:var(--ink)}

.progress{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:12px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .k{background:var(--know)} .bar .u{background:var(--unk)}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.banner button{background:none;border:0;color:var(--accent);font-weight:700;padding:0;white-space:nowrap}

.stage{position:relative;height:430px;max-height:60vh;min-height:350px;touch-action:none;user-select:none;-webkit-user-select:none;perspective:1200px}
.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;will-change:transform;touch-action:none}
.card.ghost{transform:scale(.95) translateY(12px);opacity:.55;box-shadow:none}
.card.anim{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.card.flipin{animation:flipin .26s ease-out}
@keyframes flipin{from{transform:rotateY(80deg)}to{transform:rotateY(0)}}
.tag{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 14px;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.tag .r{display:flex;align-items:center;gap:6px}
.kind{padding:2px 8px;border-radius:999px;font-weight:500}
.kind.new{background:var(--surface-2);color:var(--accent)}
.kind.rev{background:var(--unk-bg);color:var(--unk)}
.kind.prac{background:var(--know-bg);color:var(--know)}
.heart{border:0;background:none;padding:6px;border-radius:50%;display:inline-flex;color:var(--muted);line-height:0}
.heart svg{width:20px;height:20px}
.heart.on{color:var(--heart)}
.heart.on svg path{fill:currentColor}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 22px 30px;text-align:center}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1.12;text-wrap:balance;word-break:break-word}
.tap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.backside{flex:1;display:flex;flex-direction:column;gap:12px;padding:4px 20px 18px;overflow-y:auto;min-height:0}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bword{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;word-break:break-word;min-width:0}
.meta{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.zh{font-size:26px;font-weight:700;line-height:1.3}
.ex{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ex .en{font-family:var(--f-display);font-weight:500;font-size:16px}
.ex .c{color:var(--muted);font-size:14px}
.ex .lab{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.note{font-size:13px;color:var(--muted)}
.say{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13px;flex:0 0 auto}
.say svg{width:16px;height:16px}
.stamp{position:absolute;top:14px;left:50%;z-index:3;white-space:nowrap;padding:4px 12px;border:2px solid;border-radius:6px;font-weight:700;font-size:20px;opacity:0;pointer-events:none;letter-spacing:.05em;background:var(--surface)}
.stamp.k{color:var(--know);border-color:var(--know);transform:translateX(-50%)}
.stamp.u{color:var(--unk);border-color:var(--unk);transform:translateX(-50%)}

.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:14px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.know{color:var(--know);border-color:var(--know);background:var(--know-bg)}
.btn.unk{color:var(--unk);border-color:var(--unk);background:var(--unk-bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.icon{padding:11px;border-radius:50%}
.btn svg{width:18px;height:18px}
.keys{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

.done{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done h2{font-family:var(--f-display);font-size:24px;margin:0}
.done p{margin:0;color:var(--muted);font-size:14px}
.nums{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.nums b{font-family:var(--f-display);font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.nums .kk b{color:var(--know)} .nums .uu b{color:var(--unk)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.quiz .q{font-family:var(--f-display);font-weight:800;font-size:30px;text-align:center;word-break:break-word}
.quiz .qm{text-align:center;color:var(--muted);font-size:13px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:16px}
.opt.right{border-color:var(--know);background:var(--know-bg);color:var(--know);font-weight:700}
.opt.wrong{border-color:var(--unk);background:var(--unk-bg);color:var(--unk)}

/* grammar */
.gcard{touch-action:pan-y;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.gcard .tag{border-bottom:1px dashed var(--line)}
.gbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.gzh{font-size:21px;font-weight:700;line-height:1.45}
.gans{min-height:92px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--surface-2)}
.gans.ok{border-style:solid;border-color:var(--know);background:var(--know-bg)}
.gans .ph{color:var(--muted);font-size:13px;align-self:center}
.gbank{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--f-display);font-weight:500;font-size:16px;box-shadow:0 1px 0 var(--line);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tile.ghosting{opacity:.25}
.tile{position:relative}
.tile .bdg{position:absolute;top:-8px;left:-8px;width:17px;height:17px;border-radius:50%;background:var(--unk);color:var(--surface);font:700 12px/17px var(--f-mono);text-align:center;pointer-events:none}
.dragfloat{position:fixed;left:0;top:0;pointer-events:none;z-index:30;margin:0;box-shadow:var(--shadow);transform:translate(-50%,-50%) scale(1.06);cursor:grabbing}
.caret{position:absolute;width:3px;border-radius:2px;background:var(--accent);pointer-events:none}
.gans{position:relative}
.gans.drop{border-color:var(--accent)}
.tile.used{visibility:hidden}
.tile.bad{border-color:var(--unk);color:var(--unk);background:var(--unk-bg)}
.tile.good{border-color:var(--know);color:var(--know)}
.gact{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 16px}
.gfb{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.gfb.err{background:var(--unk-bg);color:var(--ink);border:1px solid var(--unk)}
.gfb.err b{color:var(--unk)}
.gfb.ok{background:var(--know-bg);border:1px solid var(--know)}
.gfb.ok b{color:var(--know)}
.gfb.show{background:var(--surface-2);border:1px solid var(--line)}
.gfb .ansline{font-family:var(--f-display);font-weight:700;font-size:17px}
.gfb ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.gfb .tip{font-size:13px;color:var(--muted)}
.gfb .tip b{color:var(--ink)}

h3.sec{font-family:var(--f-display);font-size:16px;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3.sec span{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .w{font-family:var(--f-display);font-weight:700;min-width:0;word-break:break-word}
.item .m{font-size:13px;color:var(--muted);grid-column:1;min-width:0}
.item .r{grid-row:1 / span 2;grid-column:2;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item .heart svg{width:18px;height:18px}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.lvl i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--know)}
.due{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.due.now{color:var(--unk);font-weight:500}
.pill{font-family:var(--f-mono);font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.unk{color:var(--unk);border-color:var(--unk)}
.pill.know{color:var(--know);border-color:var(--know)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.ibtn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px;font-size:12px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ibtn svg{width:14px;height:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.tabs2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--surface)}
.tabs2 button{border:0;background:none;padding:9px 6px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs2 button+button{border-left:1px solid var(--line)}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=search],input[type=text],textarea{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;font-family:var(--f-mono);font-size:13px}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
.form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.how{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.how p{margin:0 0 6px} .how p:last-child{margin:0} .how b{color:var(--ink)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-child{border-top:0}
.setrow.col{flex-direction:column;align-items:stretch;gap:8px}
.setrow .sub{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.danger{color:var(--unk)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.plan b{font-family:var(--f-display);font-size:22px}
.plan span{font-size:13px;color:var(--muted)}
details.grp{border-top:1px solid var(--line)}
details.grp:first-child{border-top:0}
details.grp summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .t{font-weight:500}
details.grp summary .t small{color:var(--muted);font-size:12px;margin-left:6px}
details.grp .gl{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.gli{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gli .tx{min-width:0}
.gli .tx div:last-child{color:var(--muted);font-family:var(--f-display)}

/* progress bars */
.prow{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.prow:first-child{border-top:0}
.prow .nm{font-size:13px;font-weight:500}
.pbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;position:relative}
.pbar .s{position:absolute;inset:0 auto 0 0;background:var(--accent-soft)}
.pbar .k{position:absolute;inset:0 auto 0 0;background:var(--know)}
.pbar .g{position:absolute;inset:0 auto 0 0;background:var(--gram)}
.prow .pt{grid-column:2;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.big{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.big div{display:flex;flex-direction:column}
.big b{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--muted)}

/* chart */
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox .ax{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.chartbox .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead b{font-family:var(--f-display);font-size:16px}
.dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.dcell{aspect-ratio:1/1.05;border:1px solid transparent;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;gap:2px;min-width:0;font-variant-numeric:tabular-nums}
.dcell .n{font-size:13px;font-weight:500;line-height:1.2}
.dcell .s{font-family:var(--f-mono);font-size:9px;line-height:1.2;color:var(--muted);white-space:nowrap}
.dcell.blank{background:none}
.dcell.done{background:var(--know-bg)} .dcell.done .s{color:var(--know)}

ust","/roʊˈbʌst/","adj.","強健的","The economy showed robust growth.","經濟成長強勁。"],["sluggish","/ˈslʌɡɪʃ/","adj.","低迷的","Sales were sluggish in the first quarter.","第一季業績低迷。"],["downturn","/ˈdaʊntɝːn/","n.","衰退","Many firms cut costs during the downturn.","景氣衰退時很多公司削減成本。"],["recession","/rɪˈseʃən/","n.","經濟衰退","The country entered a recession.","那個國家進入經濟衰退。"],["inflation","/ɪnˈfleɪʃən/","n.","通貨膨脹","Inflation reached 4% last year.","去年通膨達到 4%。"],["fluctuation","/ˌflʌktʃuˈeɪʃən/","n.","波動","Currency fluctuations affect our profits.","匯率波動影響我們的利潤。"],["exchange rate","/ɪksˈtʃeɪndʒ reɪt/","phr.","匯率","The exchange rate is favorable now.","現在匯率很有利。"],["outlook","/ˈaʊtlʊk/","n.","前景","The outlook for the industry is positive.","產業前景樂觀。"],["projected","/prəˈdʒektɪd/","adj.","預計的","Projected sales for 2027 are $5 million.","2027 年預計銷售額 500 萬美元。"],["clientele","/ˌklaɪənˈtel/","n.","（全體）顧客","The hotel has a wealthy clientele.","這間飯店的客群很富裕。"],["demographic","/ˌdeməˈɡræfɪk/","n.","人口族群","Our target demographic is young adults.","我們的目標族群是年輕人。"],["endorsement","/ɪnˈdɔːrsmənt/","n.","代言；背書","The athlete signed an endorsement deal.","那位運動員簽了代言合約。"],["testimonial","/ˌtestɪˈmoʊniəl/","n.","推薦文、使用者見證","Our website features customer testimonials.","我們網站有顧客推薦文。"],["solicit","/səˈlɪsɪt/","v.","徵求","We are soliciting feedback from users.","我們正在徵求使用者意見。"],["unsolicited","/ˌʌnsəˈlɪsɪtɪd/","adj.","未經請求的","We do not accept unsolicited proposals.","我們不接受主動投遞的提案。"],["patronage","/ˈpætrənɪdʒ/","n.","光顧、惠顧","Thank you for your continued patronage.","感謝您長期惠顧。"],["redeem","/rɪˈdiːm/","v.","兌換","Points can be redeemed for gift cards.","點數可兌換禮物卡。"],["warranty claim","/ˈwɔːrənti kleɪm/","phr.","保固申請","You can file a warranty claim online.","可以線上申請保固。"],["recall","/ˈriːkɔːl/","n./v.","（產品）召回","The company issued a recall of 10,000 heaters.","公司召回了一萬台暖爐。"],["liable","/ˈlaɪəbl/","adj.","負法律責任的","The company is not liable for lost items.","公司對遺失物品不負責。"],["indemnify","/ɪnˈdemnɪfaɪ/","v.","賠償","The supplier agrees to indemnify us for losses.","供應商同意賠償我們的損失。"],["dispute","/dɪˈspjuːt/","n./v.","爭議","The dispute was settled out of court.","爭議在庭外和解。"],["arbitration","/ˌɑːrbɪˈtreɪʃən/","n.","仲裁","The case went to arbitration.","這個案子進入仲裁。"],["litigation","/ˌlɪtɪˈɡeɪʃən/","n.","訴訟","We want to avoid costly litigation.","我們想避免昂貴的訴訟。"],["settlement","/ˈsetlmənt/","n.","和解；結算","Both sides agreed to a settlement.","雙方同意和解。"],["breach","/briːtʃ/","n./v.","違反（合約）","Late delivery is a breach of contract.","延遲交貨屬於違約。"],["counterpart","/ˈkaʊntɚpɑːrt/","n.","對應的人、對口","I met my Japanese counterpart in Tokyo.","我在東京見了日方的對口窗口。"],["liaison","/ˈliːəzɑːn/","n.","聯絡人；聯繫","She acts as a liaison between the two teams.","她是兩個團隊之間的聯絡窗口。"],["delegate","/ˈdelɪɡeɪt/","v./n.","委派；代表","A good manager knows how to delegate.","好主管懂得授權。"],["delegation","/ˌdelɪˈɡeɪʃən/","n.","代表團；授權","A delegation from Germany visited our plant.","德國代表團參觀了我們工廠。"],["itinerant","/aɪˈtɪnərənt/","adj.","巡迴的","He works as an itinerant sales trainer.","他是巡迴各地的業務講師。"],["relocation","/ˌriːloʊˈkeɪʃən/","n.","搬遷","The company paid for my relocation.","公司負擔了我的搬遷費用。"],["telecommute","/ˈtelɪkəmjuːt/","v.","遠距上班","Many staff telecommute two days a week.","很多員工每週遠距上班兩天。"],["remote work","/rɪˌmoʊt ˈwɝːk/","phr.","遠端工作","Remote work is now common.","遠端工作現在很普遍。"],["flextime","/ˈflekstaɪm/","n.","彈性工時","The company offers flextime.","公司提供彈性工時。"],["workforce","/ˈwɝːkfɔːrs/","n.","勞動力、全體員工","Women make up half of our workforce.","女性占我們員工的一半。"],["staffing","/ˈstæfɪŋ/","n.","人員配置","We have staffing problems on weekends.","週末人手不足。"],["understaffed","/ˌʌndɚˈstæft/","adj.","人手不足的","The store is understaffed today.","店裡今天人手不足。"],["payroll","/ˈpeɪroʊl/","n.","薪資名冊；薪資","Payroll is processed on the 25th.","薪資在 25 號處理。"],["deduction","/dɪˈdʌkʃən/","n.","扣除額","Tax deductions are shown on your pay slip.","扣稅金額列在薪資單上。"],["withhold","/wɪθˈhoʊld/","v.","扣留、保留","Taxes are withheld from your salary.","稅款會從薪資中扣繳。"],["gross","/ɡroʊs/","adj.","總的、毛的","Gross revenue rnet addiction is a growing problem.","網路成癮是日益嚴重的問題。"],["alarming","/əˈlɑːrmɪŋ/","adj.","令人憂心的","Obesity is rising at an alarming rate.","肥胖以驚人的速度增加。"],["ancestor","/ˈænsestɚ/","n.","祖先","Our ancestors lived very differently.","我們的祖先生活方式很不一樣。"],["appeal","/əˈpiːl/","n./v.","吸引力；呼籲","City life appeals to young people.","城市生活吸引年輕人。"],["assumption","/əˈsʌmpʃən/","n.","假設","This is based on a false assumption.","這是基於錯誤的假設。"],["awareness","/əˈwernəs/","n.","意識","Public awareness of recycling has grown.","大眾的回收意識提高了。"],["beneficial","/ˌbenɪˈfɪʃl/","adj.","有益的","Exercise is beneficial to health.","運動對健康有益。"],["capable of","/ˈkeɪpəbl əv/","phr.","有能力","Machines are capable of learning.","機器有學習的能力。"],["citizen","/ˈsɪtɪzn/","n.","公民","Every citizen has the right to vote.","每個公民都有投票權。"],["claim","/kleɪm/","v./n.","聲稱；主張","Some people claim that games are educational.","有些人聲稱遊戲有教育意義。"],["compensate for","/ˈkɑːmpenseɪt fɔːr/","phr.","彌補","Higher pay cannot compensate for stress.","高薪無法彌補壓力。"],["concern","/kənˈsɝːn/","n.","擔憂","There is growing concern about privacy.","大家越來越擔心隱私。"],["contribute","/kənˈtrɪbjuːt/","v.","貢獻","Everyone can contribute to society.","每個人都能為社會做出貢獻。"],["crucially","/ˈkruːʃəli/","adv.","關鍵地","Crucially, the plan is affordable.","關鍵是這計畫負擔得起。"],["cyclist","/ˈsaɪklɪst/","n.","騎自行車的人","Cities need safe lanes for cyclists.","城市需要安全的自行車道。"],["debate","/dɪˈbeɪt/","n./v.","辯論","There is an ongoing debate about this.","這件事一直有爭論。"],["dependence","/dɪˈpendəns/","n.","依賴","Our dependence on oil must end.","我們必須結束對石油的依賴。"],["desirable","/dɪˈzaɪərəbl/","adj.","令人嚮往的","A university degree is desirable.","大學學位令人嚮往。"],["despite","/dɪˈspaɪt/","prep.","儘管","Despite the cost, many people travel.","儘管花費高，很多人還是去旅行。"],["drawback","/ˈdrɔːbæk/","n.","缺點","The main drawback is the cost.","主要缺點是費用。"],["employer","/ɪmˈplɔɪɚ/","n.","雇主","Employers value communication skills.","雇主重視溝通能力。"],["enable","/ɪˈneɪbl/","v.","使能夠","The internet enables us to work anywhere.","網路讓我們能在任何地方工作。"],[" al","/ˈpræktɪkl/","adj.","實用的","Schools should teach practical skills.","學校應教實用技能。"],["prioritise","/praɪˈɔːrətaɪz/","v.","優先處理","Governments should prioritise health.","政府應優先考量健康。"],["progress","/ˈprɑːɡres/","n.","進步","Medicine has made great progress.","醫學有很大進步。"],["reliance on","/rɪˈlaɪəns ɑːn/","phr.","對…的依賴","Our reliance on cars causes pollution.","我們對汽車的依賴造成汙染。"],["rewarding","/rɪˈwɔːrdɪŋ/","adj.","值得的、有成就感的","Teaching is a rewarding job.","教書是有成就感的工作。"],["sedentary lifestyle","/ˌsednteri ˈlaɪfstaɪl/","phr.","久坐的生活方式","A sedentary lifestyle leads to health problems.","久坐的生活方式導致健康問題。"],["short-term","/ˌʃɔːrt ˈtɝːm/","adj.","短期的","This is only a short-term fix.","這只是短期的解決辦法。"],["stable","/ˈsteɪbl/","adj.","穩定的","The figure remained stable.","數字維持穩定。"],["statistic","/stəˈtɪstɪk/","n.","統計數字","Statistics show that crime has fallen.","統計顯示犯罪減少了。"],["steady","/ˈstedi/","adj.","穩定的","There was a steady rise in prices.","價格穩定上漲。"],["tendency","/ˈtendənsi/","n.","傾向","There is a tendency to buy more online.","有越來越多在網上購物的傾向。"],["unemployed","/ˌʌnɪmˈplɔɪd/","adj.","失業的","Many young people are unemployed.","很多年輕人失業。"],["unhealthy","/ʌnˈhelθi/","adj.","不健康的","Unhealthy food is cheap.","不健康的食物很便宜。"],["upbringing","/ˈʌpbrɪŋɪŋ/","n.","教養","Upbringing shapes personality.","教養塑造個性。"],["violent","/ˈvaɪələnt/","adj.","暴力的","Violent films may affect children.","暴力電影可能影響孩子。"],["violence","/ˈvaɪələns/","n.","暴力","Violence on TV is a concern.","電視上的暴力令人擔憂。"]]},{"c":"ielts","l":3,"w":[["detrimental","/ˌdetrɪˈmentl/","adj.","有害的","Lack of sleep is detrimental to health.","睡眠不足有害健康。"],["exacerbate","/ɪɡˈzæsɚbeɪt/","v.","使惡化","Cutting funding would exacerbate the problem.","削減經費會讓問題更嚴重。"],["mitigate","/ˈmɪtɪɡeɪt/","v.","緩解、減輕","Trees can mitigate the effects of heat.","樹木能減緩高溫的影響。"],["unprecedented","/ʌnˈpresɪdentɪd/","adj.","前所未有的","The city faced an unprecedented crisis.","這座城市面臨前所未有的危機。"],["ubiquitous","/juːˈbɪkwɪtəs/","adj.","無所不在的","Smartphones have become ubiquitous.","智慧型手機已經無所不在。"],["paradigm","/ˈpærədaɪm/","n.","典範、模式","Remote work represents a paradigm shift.","遠距工作代表一種典範轉移。"],["inequality","/ˌɪnɪˈkwɑːləti/","n.","不平等","Income inequality has widened.","所得不平等擴大了。"],["marginalized","/ˈmɑːrdʒɪnəlaɪzd/","adj.","被邊緣化的","Marginalized groups need more support.","弱勢族群需要更多支持。"],["disproportionate","/ˌdɪsprəˈpɔːrʃənət/","adj.","不成比例的","The poor are affected to a disproportionate degree.","窮人受到的影響不成比例地大。"],["compelling","/kəmˈpelɪŋ/","adj.","有說服力的","There is compelling evidence for this view.","有強而有力的證據支持這個觀點。"],["contentious","/kənˈtenʃəs/","adj.","有爭議的","Animal testing remains a contentious issue.","動物實驗仍是有爭議的議題。"],["undermine","/ˌʌndɚˈmaɪn/","v.","削弱、破壞","Fake news undermines public trust.","假新聞削弱大眾信任。"],["foster","/ˈfɑːstɚ/","v.","培養、促進","Team sports foster cooperation.","團隊運動能培養合作精神。"],["curb","/kɝːb/","v.","抑制","Measures were taken to curb inflation.","政府採取措施抑制通膨。"],["deteriorate","/dɪˈtɪriəreɪt/","v.","惡化","Air quality has deteriorated in recent years.","近年空氣品質惡化。"],["proliferation","/prəˌlɪfəˈreɪʃən/","n.","激增、擴散","The proliferation of fast-food chains is worrying.","速食連鎖店激增令人擔憂。"],["sedentary","/ˈsednteri/","adj.","久坐不動的","Office workers often lead sedentary lives.","上班族常常久坐不動。"],["incentivize","/ɪnˈsentɪvaɪz/","v.","激勵、給予誘因","The government should incentivize recycling.","政府應該用誘因鼓勵回收。"],["inherent","/ɪnˈhɪrənt/","adj.","固有的、內在的","Every investment has inherent risks.","每項投資都有固有風險。"],["plausible","/ˈplɔːzəbl/","adj.","合理的、似乎可信的","That is a plausible explanation.","這是一個說得通的解釋。"],["notwithstanding","/ˌnɑːtwɪθˈstændɪŋ/","prep.","儘管","Notwithstanding the costs, the project went ahead.","儘管成本高，專案還是繼續進行。"],["hence","/hens/","adv.","因此","Prices rose; hence, demand fell.","價格上漲，因此需求下降。"],["thereby","/ˌðerˈbaɪ/","adv.","藉此、從而","Taxes were lowered, thereby boosting spending.","稅降低了，因而刺激了消費。"],["it is widely acknowledged that","/ˌwaɪdli əkˈnɑːlɪdʒd/","phr.","普遍認為","It is widely acknowledged that exercise reduces stress.","一般公認運動能減輕壓力。"],["to a certain extent","/tə ə ˌsɝːtn ɪkˈstent/","phr.","在某種程度上","I agree with this view to a certain extent.","我在某種程度上同意這個看法。"],["a double-edged sword","/ə ˌdʌbl edʒd ˈsɔːrd/","phr.","雙面刃","Social media is a double-edged sword.","社群媒體是一把雙面刃。"],["give rise to","/ˌɡɪv ˈraɪz tuː/","phr.","引起、導致","Tourism can give rise to environmental problems.","觀光可能引發環境問題。"],["at the expense of","/ət ði ɪkˈspens əv/","phr.","以…為代價","Growth came at the expense of the environment.","成長是以犧牲環境為代價。"],["cognitive","/ˈkɑːɡnətɪv/","adj.","認知的","Reading improves cognitive skills.","閱讀能提升認知能力。"],["holistic","/hoʊˈlɪstɪk/","adj.","全面的、整體的","We need a holistic approach to education.","教育需要全面性的做法。"],["affluent","/ˈæfluənt/","adj.","富裕的","Affluent families can afford private schools.","富裕家庭負擔得起私立學校。"],["alienation","/ˌeɪliəˈneɪʃən/","n.","疏離感","Technology can lead to social alienation.","科技可能導致社會疏離。"],["ambiguity","/ˌæmbɪˈɡjuːəti/","n.","模稜兩可","The law contains some ambiguity.","這條法律有些模糊之處。"],["ameliorate","/əˈmiːliəreɪt/","v.","改善","Policies to ameliorate poverty are needed.","需要改善貧窮的政策。"],["anomaly","/əˈnɑːməli/","n.","異常","The cold summer was an anomaly.","那年涼爽的夏天是個異常現象。"],["arbitrary","/ˈɑːrbɪtreri/","adj.","任意的、武斷的","The age limit seems arbitrary.","年齡限制似乎很武斷。"],["articulate","/ɑːrˈtɪkjuleɪt/","v./adj.","清楚表達；能言善道的","Children should learn to articulate their ideas.","孩子應該學會清楚表達想法。"],["assimilate","/əˈsɪməleɪt/","v.","同化；吸收","Immigrants often assimilate within a generation.","移民常在一代之內被同化。"],["autonomy","/ɔːˈtɑːnəmi/","n.","自主權","Teachers want more autonomy.","老師想要更多自主權。"],["benevolent","/bəˈnevələnt/","adj.","仁慈的","A benevolent government cares for the poor.","仁慈的政府照顧窮人。"],["bias","/ˈbaɪəs/","n.","偏見","The media often shows bias.","媒體常帶有偏見。"],["blatant","/ˈbleɪtnt/","adj.","明目張膽的","It was a blatant lie.","那是明目張膽的謊言。"],["burgeoning","/ˈbɝːdʒənɪŋ/","adj.","迅速發展的","The burgeoning population needs more housing.","快速增加的人口需要更多住房。"],["catastrophic","/ˌkætəˈstrɑːfɪk/","adj.","災難性的","Rising seas could have catastrophic effects.","海平面上升可能帶來災難性影響。"],["coherent","/koʊˈhɪrənt/","adj.","連貫的","Your essay must be coherent.","你的文章必須連貫。"],["commodity","/kəˈmɑːdəti/","n.","商品；有用的東西","Water is becoming a valuable commodity.","水正變成珍貴的商品。"],["complacent","/kəmˈpleɪsnt/","adj.","自滿的","We cannot be complacent about safety.","我們不能對安全掉以輕心。"],["concede","/kənˈsiːd/","v.","承認、讓步","I concede that the plan has some benefits.","我承認這個計畫有些好處。"],["conducive to","/kənˈduːsɪv tuː/","phr.","有助於","A quiet room is conducive to study.","安靜的房間有助讀書。"],["contend","/kənˈtend/","v.","主張；競爭","Critics contend that the tax is unfair.","批評者主張這項稅不公平。"],["correlation","/ˌkɔːrəˈleɪʃən/","n.","相關性","There is a strong correlation between income and health.","收入與健康之間有很強的相關性。"],["counterproductive","/ˌkaʊntɚprəˈdʌktɪv/","adj.","適得其反的","Punishment can be counterproductive.","懲罰可能適得其反。"],["credible","/ˈkredəbl/","adj.","可信的","We need credible evidence.","我們需要可信的證據。"],["cultivate","/ˈkʌltɪveɪt/","v.","培養；耕作","Schools should cultivate curiosity.","學校應該培養好奇心。"],["cumulative","/ˈkjuːmjələtɪv/","adj.","累積的","The cumulative effect of stress is serious.","壓力的累積效應很嚴重。"],["debilitating","/dɪˈbɪlɪteɪtɪŋ/","adj.","使衰弱的","Depression can be debilitating.","憂鬱症可能令人虛弱不堪。"],["degradation","/ˌdeɡrəˈdeɪʃən/","n.","惡化、退化","Environmental degradation affects the poor most.","環境惡化對窮人影響最大。"],["demographic shift","/ˌdeməˌɡræfɪk ˈʃɪft/","phr.","人口結構轉變","Taiwan is facing a major demographic shift.","台灣正面臨重大的人口結構轉變。"],["deterrent","/dɪˈtɝːənt/","n.","嚇阻（物）","Is prison an effective deterrent?","監禁是有效的嚇阻嗎？"],["dichotomy","/daɪˈkɑːtəmi/","n.","二分法","There is a false dichotomy between growth and the environment.","成長與環境之間的二分法是錯誤的。"],["dilemma","/dɪˈlemə/","n.","兩難","Parents face a dilemma about screen time.","父母在螢幕時間上面臨兩難。"],["discriminate","/dɪˈskrɪmɪneɪt/","v.","歧視","Employers must not discriminate against women.","雇主不得歧視女性。"],["disparity","/dɪˈspærəti/","n.","差距","The disparity in income is growing.","收入差距在擴大。"],["disseminate","/dɪˈsemɪneɪt/","v.","散播" 詞 I 搭配 am。"],["ate","am 後面要接 V-ing，不能接過去式。"]],"a":[{"en":"Now I am eating lunch.","why":"now 放句首也可以；放句尾比較常見。","bad":false}],"n":"現在進行式：am / is / are + V-ing，表示此刻正在發生的動作。"},{"t":"prog","l":1,"zh":"孩子們正在公園裡玩。","en":"The children are playing in the park.","d":[["is","children 是複數，要用 are。"],["played","are 後面要接 V-ing：playing。"],["child","「孩子們」是複數 children。"]],"a":[],"n":"child 的複數是不規則的 children，搭配 are。"},{"t":"prog","l":1,"zh":"你在聽我說話嗎？","en":"Are you listening to me?","d":[["Do","句中用 listening，助動詞要用 be 動詞 are，不用 do。"],["listen","are 後面要接 V-ing：listening。"],["Is","主詞 you 搭配 are。"]],"a":[],"n":"進行式疑問句：把 be 動詞移到主詞前面。"},{"t":"prog","l":1,"zh":"她這週在家工作。","en":"She is working from home this week.","d":[["works","已經有 is，後面要接 working，不能接 works。"],["are","主詞 she 搭配 is。"],["worked","is 後面要接 V-ing。"]],"a":[{"en":"This week she is working from home.","why":"this week 放句首也可以。","bad":false}],"n":"現在進行式也能表示「這段時間暫時的狀態」。"},{"t":"prog","l":1,"zh":"我們下週五要飛去東京。","en":"We are flying to Tokyo next Friday.","d":[["fly","are 後面要接 V-ing：flying。"],["is","主詞 we 搭配 are。"],["flew","are 後面要接 V-ing，不能接過去式。"]],"a":[{"en":"Next Friday we are flying to Tokyo.","why":"時間放句首也可以。","bad":false}],"n":"已經安排好的近期計畫，可以用現在進行式表示未來。"},{"t":"prog","l":1,"zh":"他沒有在睡覺，他在看書。","en":"He isn't sleeping. He is reading.","d":[["doesn't","進行式的否定是 isn't，不用 doesn't。"],["sleeps","isn't 後面要接 V-ing：sleeping。"],["reads","is 後面要接 V-ing：reading。"]],"a":[{"en":"He is reading. He isn't sleeping.","why":"兩句對調也對；標準答案照中文的順序，先說沒在睡覺。","bad":false}],"n":"進行式否定：am not / isn't / aren't + V-ing。"},{"t":"past","l":1,"zh":"我昨天跟客戶開會。","en":"I met a client yesterday.","d":[["meet","yesterday 表示過去，要用過去式 met。"],["meeted","meet 是不規則動詞，過去式是 met。"],["meets","說的是昨天的事，要用過去式 met。"]],"a":[{"en":"Yesterday I met a client.","why":"yesterday 放句首也可以。","bad":false}],"n":"過去簡單式描述過去發生、已經結束的事；要記不規則動詞變化。"},{"t":"past","l":1,"zh":"你上週末去哪裡？","en":"Where did you go last weekend?","d":[["went","已經有 did，後面接原形 go。"],["do","last weekend 是過去，助動詞用 did。"],["goes","did 後面接原形 go。"]],"a":[],"n":"過去式疑問句：疑問詞 + did + 主詞 + 原形動詞。"},{"t":"past","l":1,"zh":"她三年前搬到台北。","en":"She moved to Taipei three years ago.","d":[["moves","three years ago 是過去，要用過去式 moved。"],["move","過去發生的事，要用 moved。"],["year","三年是複數，用 years。"]],"a":[{"en":"Three years ago she moved to Taipei.","why":"時間放句首也可以。","bad":false}],"n":"ago 表示「從現在算起多久以前」，搭配過去式。"},{"t":"past","l":1,"zh":"我們昨晚沒有看電視。","en":"We didn't watch TV last night.","d":[["watched","didn't 後面接原形動詞 watch。"],["don't","last night 是過去，否定用 didn't。"],["watching","didn't 後面接原形，不能用 V-ing。"]],"a":[{"en":"Last night we didn't watch TV.","why":"時間放句首也可以。","bad":false}],"n":"過去式否定：didn't + 原形動詞。"},{"t":"past","l":1,"zh":"我們昨天看的那部電影很無聊。","en":"The movie we saw yesterday was boring.","d":[["bored","形容「事物讓人覺得」無聊用 boring；bored 是人自己覺得無聊。"],["see","昨天看的，要用過去式 saw。"],["is","昨天看的電影，用過去式 was。"]],"a":[],"n":"-ing 形容詞描述事物的特性，-ed 形容詞描述人的感受。"},{"t":"past","l":1,"zh":"他們去年在日本買了一間房子。","en":"They bought a house in Japan last year.","d":[["buyed","buy 的過去式是不規則的 bought。"],["buy","last year 是過去，要用過去式 bought。"],["houses","a 後面接單數 house。"]],"a":[{"en":"Last year they bought a house in Japan.","why":"時間放句首也可以。","bad":false}],"n":"常見不規則動詞：buy-bought、go-went、see-saw、take-took。"},{"t":"past","l":1,"zh":"當時你在家嗎？","en":"Were you at home then?","d":[["Was","主詞是 you，過去式 be 動詞用 were。"],["Did","有 be 動詞的句子，問句直接把 were 移到前面，不用 did。"],["Are","then 是「當時」，說的是過去，用 were。"]],"a":[],"n":"be 動詞過去式：I / he / she / it 用 was，you / we / they 用 were。"},{"t":"fut","l":1,"zh":"我明天會打電話給你。","en":"I will call you tomorrow.","d":[["called","will 後面接原形動詞 call。"],["calls","will 後面接原形，不加 s。"],["calling","will 後面接原形，不接 V-ing。"]],"a":[{"en":"Tomorrow I will call you.","why":"時間放句首也可以。","bad":false}],"n":"will + 原形動詞，表示未來或當下做的決定。"},{"t":"fut","l":1,"zh":"天氣預報說明天會下雨。","en":"The forecast says it will rain tomorrow.","d":[["rains","will 後面接原形 rain。"],["say","the forecast 是單數，動詞要用 says。"],["raining","will 後面接原形，不接 V-ing。"]],"a":[],"n":"預測未來可以用 will + 原形動詞。"},{"t":"fut","l":1,"zh":"我打算下個月開始運動。","en":"I am going to start exercising next month.","d":[["starting","going to 的 to 後面接原形 start。"],["exercise","start 在這裡後面接 V-ing：exercising。"],["is","主詞 I 搭配 am。"]],"a":[{"en":"Next month I am going to start exercising.","why":"時間放句首也可以。","bad":false}],"n":"be going to + 原形動詞：表示已經打算好的計畫。"},{"t":"fut","l":1,"zh":"你今晚會來派對嗎？","en":"Will you come to the party tonight?","d":[["comes","will 後面接原形 come。"],["came","will 後面接原形 come。"],["coming","will 後面接原形，不接 V-ing。"]],"a":[],"n":"will 的疑問句：Will + 主詞 + 原形動詞？"},{"t":"fut","l":1,"zh":"小心！你要跌倒了。","en":"Be careful! You're going to fall.","d":[["falling","going to 後面接原形 fall。"],["Is","祈使句「小心」用原形 Be careful。"],["carefully","be 動詞後面接形容詞 careful，不是副詞。"]],"a":[],"n":"看得到徵兆、馬上要發生的事，用 be going to。"},{"t":"fut","l":1,"zh":"我不會忘記你的生日。","en":"I won't forget your birthday.","d":[["forgot","won't 後面接原形 forget。"],["forgetting","won't 後面接原形，不接 V-ing。"],["you","「你的生日」要用所有格 your。"]],"a":[],"n":"won't = will not，後面接原形動詞。"},{"t":"modal","l":1,"zh":"你應該多喝水。","en":"You should drink more water.","d":[["drinking","should 後面接原形動詞 drink。"],["drinks","should 後面接原形，不加 s。"],["much","「多喝一點」要用比較級 more。"]],"a":[],"n":"should 表示建議，後接原形動詞。"},{"t":"modal","l":1,"zh":"我可以用你的筆嗎？","en":"Can I use your pen?","d":[["using","can 後面接原形動詞 use。"],["you","「你的筆」要用所有格 your。"],["uses","can 後面接原形，不加 s。"]],"a":[],"n":"Can I...? 請求許可；更客氣可以說 May I...?"},{"t":"modal","l":1,"zh":"她會說三種語言。","en":"She can speak three languages.","d":[["speaks","can 後面接原形 speak。"],["cans","can 沒有加 s 的變化。"],["language","three 後面接複數 languages。"]],"a":[],"n":"情態助動詞（can / should / must / will）不加 s，後面接原形動詞。"},{"t":"modal","l":1,"zh":"你一定要戴安全帽。","en":"You must wear a helmet.","d":[["wearing","must 後面接原形 wear。"],["wears","must 後面接原形，不加 s。"],["wore","must 後面接原形，不接過去式。"]],"a":[],"n":"must 表示必須、強制。"},{"t":"modal","l":1,"zh":"你不必今天完成。","en":"You don't have to finish it today.","d":[["doesn't","主詞是 you，用 don't。"],["has","don't 後面接原形 have。"],["finishing","have to 後面接原形 finish。"]],"a":[],"n":"don't have to = 不必；mustn't = 不可以，兩者意思完全不同。"},{"t":"modal","l":1,"zh":"他可能在開會。","en":"He might be in a meeting.","d":[["is","might 後面接原形 be。"],["mights","might 沒有加 s 的變化。"],["being","might 後面接原形 be。"]],"a":[],"n":"might / may 表示「可能」。"},{"t":"modal","l":1,"zh":"你可以幫我開門嗎？","en":"Could you open the door for me?","d":[["opened","could 後面接原形 open。"],["opens","could 後面接原形，不加 s。"],["I","介系詞 for 後面要用受格 me。"]],"a":[],"n":"Could you...? 比 Can you...? 更客氣。"},{"t":"q","l":1,"zh":"你住在哪裡？","en":"Where do you live?","d":[["does","主詞是 you，助動詞用 do。"],["lives","do 後面接原形 live。"],["living","do 後面接原形 live。"]],"a":[],"n":"疑問詞 + do / does / did + 主詞 + 原形動詞。"},{"t":"q","l":1,"zh":"這班火車幾點出發？","en":"What time does the train leave?","d":[["do","the train 是單數，用 does。"],["leaves","does 後面接原形 leave，不加 s。"],["left","does 後面接原形 leave。"]],"a":[],"n":"主詞是第三人稱單數時用 does，動詞回到原形。"},{"t":"q","l":1,"zh":"你為什麼遲到？","en":"Why were you late?","d":[["did","late 是形容詞，要搭配 be 動詞，不用 did。"],["was","主詞是 you，過去式 be 動詞用 were。"],["lately","be 動詞後面接形容詞 late；lately 是「最近」。"]],"a":[],"n":"be 動詞的疑問句，直接把 be 動詞移到主詞前。"},{"t":"q","l":1,"zh":"這件外套多少錢？","en":"How much is this jacket?","d":[["are","this jacket 是單數，用 is。"],["many","問價錢用 How much。"],["jackets","this 後面接單數 jacket。"]],"a":[],"n":"How much 問價錢或不可數的量；How many 問可數的數量。"},{"t":"q","l":1,"zh":"你多久去一次健身房？","en":"How often do you go to the gym?","d":[["goes","do 後面接原形 go。"],["does","主詞是 you，用 do。"],["going","do 後面接原形 go。"]],"a":[],"n":"How often 問頻率；How long 問時間長度。"},{"t":"q","l":1,"zh":"誰打電話給你？","en":"Who called you?","d":[["call","沒有助動詞時，已經發生的事要用過去式 called。"],["calling","沒有 be 動詞，不能單獨用 calling。"],["your","call 後面接受格 you。"]],"a":[],"n":"疑問詞當主詞時，直接接動詞，不用 do / does / did。"},{"t":"q","l":1,"zh":"你喜歡哪一個？","en":"Which one do you like?","d":[["does","主詞是 you，用 do。"],["likes","do 後面接原形 like。"],["ones","問「哪一個」用單數 one。"]],"a":[],"n":"Which 用在有限選項中挑一個。"},{"t":"q","l":1,"zh":"你有沒有去過台南？","en":"Have you ever been to Tainan?","d":[["went","have 後面接過去分詞 been，不接過去式 went。"],["Has","主詞是 you，用 have。"],["be","have 後面接過去分詞 been。"]],"a":[],"n":"問人生經驗：Have you ever + 過去分詞？"},{"t":"comp","l":1,"zh":"台北比台中大。","en":"Taipei is bigger than Taichung.","d":[["more","big 是短形容詞，比較級是 bigger，不用 more。"],["biggest","兩者比較用比較級，不用最高級。"],["big","有 than 要用比較級 bigger。"]],"a":[],"n":"短形容詞加 -er；字尾是「短母音 + 子音」要重複子音：big → bigger。"},{"t":"comp","l":1,"zh":"這是我吃過最好吃的蛋糕。","en":"This is the best cake I have ever eaten.","d":[["better","最高級要用 the best。"],["ate","have 後面接過去分詞 eaten。"],["good","the ___ cake I have ever eaten 要用最高級 best。"]],"a":[],"n":"the + 最高級 + 名詞 + I have ever + 過去分詞：「我…過最…的」。"},{"t":"comp","l":1,"zh":"這支手機比那支貴。","en":"This phone is more expensive than that one.","d":[["expensiver","多音節形容詞用 more expensive，不加 -er。"],["most","兩者比較用 more，不用最高級 most。"],["ones","that one 指一支手機，用單數 one。"]],"a":[],"n":"兩個音節以上的形容詞，大多用 more / most。"},{"t":"comp","l":1,"zh":"他跟他爸爸一樣高。","en":"He is as tall as his father.","d":[["taller","as...as 中間用原級 tall。"],["tallest","as...as 中間用原級 tall。"],["him","「他的爸爸」要用所有格 his。"]],"a":[],"n":"as + 原級 + as：一樣…。"},{"t":"comp","l":1,"zh":"今天比昨天冷多了。","en":"Today is much colder than yesterday.","d":[["coldest","兩天比較用比較級 colder。"],["cold","有 than 要用比較級 colder。"],["more","cold 是短形容詞，比較級直接加 -er。"]],"a":[],"n":"much / far / a lot 可以修飾比較級，very 不行。"},{"t":"comp","l":1,"zh":"她是班上最聰明的學生。","en":"She is the smartest student in the class.","d":[["smarter","跟全班比要用最高級 smartest。"],["students","這裡只指她一個人，用單數 student。"],["smart","有 the 和 in the class，要用最高級。"]],"a":[],"n":"最高級後面接範圍：in + 地方或團體；of + 一群人或物。"},{"t":"comp","l":1,"zh":"我的英文沒有你的好。","en":"My English is not as good as yours.","d":[["well","be 動詞後面接形容詞 good；well 是副詞。"],["better","as...as 中間用原級 good。"],["you","比較的是英文，要用 yours（你的英文）。"]],"a":[],"n":"not as...as：沒有…那麼…。"},{"t":"prep","l":1,"zh":"會議在週一早上十點。","en":"The meeting is at 10 a.m. on Monday.","d":[["in","時刻用 at、星期幾用 on；in 用在月份、年份。"],["are","the meeting 是單數，用 is。"],["meetings","這裡指一場會議，用單數 meeting。"]],"a":[{"en":"The meeting is on Monday at 10 a.m.","why":"時刻和星期對調也對；英文通常先說小的時間單位（10 a.m.）再說大的（Monday）。","bad":false}],"n":"時間介系詞：at + 時刻、on + 日期或星期、in + 月份、年份或季節。"},{"t":"prep","l":1,"zh":"我出生於 2004 年。","en":"I was born in 2004.","d":[["am","出生是過去的事，用 was。"],["bear","be born 是固定說法，要用過去分詞 born。"],["on","年份前面用 in；on 用在某一天。"]],"a":[{"en":"In 2004 I was born.","why":"文法上可以，但聽起來很不自然；一般都說 I was born in 2004。","bad":false}],"n":"in + 年份 / 月份；on + 某一天。"},{"t":"prep","l":1,"zh":"鑰匙在桌上。","en":"The keys are on the table.","d":[["is","keys 是複數，用 are。"],["tables","the table 指一張桌子，用單數。"],["in","在表面上用 on；in 是在裡面。"]],"a":[],"n":"on = 在表面上；in = 在裡面；under = 在下面。"},{"t":"prep","l":1,"zh":"我們在機場碰面吧。","en":"Let's meet at the airport.","d":[["meeting","Let's 後面接原形 meet。"],["meets","Let's 後面接原形，不加 s。"],["airports","the airport 指一個機場，用單數。"]],"a":[],"n":"at + 地點（一個點的概念）：at the airport、at the station。"},{"t":"prep","l":1,"zh":"她坐公車來上班。","en":"She comes to work by bus.","d":[["come","she 是第三人稱單數，用 comes。"],["buses","by 後面接單數的交通工具 bus。"],["working","to work 是「去上班」，work 用原形。"]],"a":[],"n":"by + 交通工具（不加冠詞）：by car、by train。"},{"t":"prep","l":1,"zh":"我在這家公司工作兩年了。","en":"I have worked at this company for two years.","d":[["work","have 後面接過去分詞 worked。"],["has","主詞 I 用 have。"],["since","兩年是時間長度，用 for；since 後面接起點。"]],"a":[],"n":"for + 時間長度；since + 起點時間。"},{"t":"prep","l":1,"zh":"我會在五點之前到。","en":"I will arrive before five.","d":[["arriving","will 後面接原形 arrive。"],["arrives","will 後面接原形，不加 s。"],["arrived","will 後面接原形 arrive。"]],"a":[{"en":"Before five I will arrive.","why":"文法上可以，但比較少這樣說；一般把時間放句尾。","bad":false}],"n":"before 之前；after 之後；by 最晚在…之前。"},{"t":"there","l":1,"zh":"桌上有一本書。","en":"There is a book on the table.","d":[["are","a book 是單數，用 is。"],["books","a 後面接單數 book。"],["has","「某處有某物」用 There is，不用 has。"]],"a":[{"en":"On the table there is a book.","why":"地點放句首也可以，但 There is 開頭比較常見。","bad":false}],"n":"There is + 單數 / 不可數；There are + 複數。"},{"t":"there","l":1,"zh":"這附近有很多餐廳。","en":"There are many restaurants near here.","d":[["is","restaurants 是複數，用 are。"],["restaurant","many 後面接複數 restaurants。"],["much","可數名詞用 many；much 用在不可數名詞。"]],"a":[],"n":"There are + 複數名詞 + 地點。"},{"t":"there","l":1,"zh":"冰箱裡沒有牛奶。","en":"There isn't any milk in the fridge.","d":[["aren't","milk 是不可數名詞，用 isn't。"],["milks","milk 不可數，不加 s。"],["some","否定句用 any。"]],"a":[],"n":"否定和疑問句用 any；肯定句用 some。"},{"t":"there","l":1,"zh":"你們辦公室有停車場嗎？","en":"Is there a parking lot at your office?","d":[["Are","a parking lot 是單數，用 Is there。"],["lots","a 後面接單數 lot。"],["you","「你們的辦公室」用所有格 your。"]],"a":[],"n":"疑問句：Is there / Are there...?"},{"t":"there","l":1,"zh":"昨天有一場暴風雨。","en":"There was a big storm yesterday.","d":[["is","yesterday 是過去，用 was。"],["were","a big storm 是單數，用 was。"],["storms","a 後面接單數 storm。"]],"a":[{"en":"Yesterday there was a big storm.","why":"時間放句首也可以。","bad":false}],"n":"There was / There were 是過去式。"},{"t":"perf","l":2,"zh":"我已經完成報告了。","en":"I have already finished the report.","d":[["finish","have 後面接過去分詞 finished。"],["has","主詞 I 用 have。"],["finishing","have 後面接過去分詞，不用 V-ing。"]],"a":[{"en":"I have finished the report already.","why":"already 放句尾也可以，口語常見；放在 have 和過去分詞中間比較標準。","bad":false}],"n":"現在完成式：have / has + 過去分詞，表示到現在為止已經完成的事。"},{"t":"perf","l":2,"zh":"她在這裡工作五年了。","en":"She has worked here for five years.","d":[["have","主詞 she 是第三人稱單數，用 has。"],["work","has 後面接過去分詞 worked。"],["year","five 後面接複數 years。"]],"a":[],"n":"從過去持續到現在的狀態用現在完成式，搭配 for / since。"},{"t":"perf","l":2,"zh":"你吃過臭豆腐嗎？","en":"Have you ever eaten stinky tofu?","d":[["ate","have 後面接過去分詞 eaten，不是過去式 ate。"],["Has","主詞是 you，用 have。"],["eat","have 後面接過去分詞 eaten。"]],"a":[],"n":"eat 三態：eat - ate - eaten。"},{"t":"perf","l":2,"zh":"我從 2020 年就認識他了。","en":"I have known him since 2020.","d":[["knew","have 後面接過去分詞 known。"],["he","know 後面接受格 him。"],["know","have 後面接過去分詞 known。"]],"a":[{"en":"Since 2020 I have known him.","why":"文法上可以，但比較少這樣說；一般把 since 放句尾。","bad":false}],"n":"since + 起點；for + 長度。know 三態：know - knew - known。"},{"t":"perf","l":2,"zh":"他們還沒回覆我們。","en":"They haven't replied to us yet.","d":[["hasn't","主詞 they 是複數，用 haven't。"],["reply","haven't 後面接過去分詞 replied。"],["we","介系詞 to 後面用受格 us。"]],"a":[],"n":"yet 用於否定句與疑問句，通常放句尾。"},{"t":"perf","l":2,"zh":"我剛到辦公室。","en":"I have just arrived at the office.","d":[["arrive","have 後面接過去分詞 arrived。"],["has","主詞 I 用 have。"],["arriving","have 後面接過去分詞，不用 V-ing。"]],"a":[],"n":"just 放在 have 和過去分詞之間，表示「剛剛」。"},{"t":"perf","l":2,"zh":"這個問題已經解決了嗎？","en":"Has the problem been solved?","d":[["Have","the problem 是單數，用 Has。"],["solve","been 後面接過去分詞 solved。"],["being","完成式被動是 has been，不是 being。"]],"a":[],"n":"現在完成式被動：have / has been + 過去分詞。"},{"t":"perf","l":2,"zh":"我去過日本三次。","en":"I have been to Japan three times.","d":[["went","have 後面接過去分詞 been。"],["gone","have gone to 是「去了還沒回來」，「去過」要用 have been to。"],["time","three 後面接複數 times。"]],"a":[],"n":"have been to = 曾經去過；have gone to = 已經去了、人還在那裡。"},{"t":"pass","l":2,"zh":"這座橋是 1990 年建造的。","en":"This bridge was built in 1990.","d":[["is","1990 年是過去，用 was。"],["build","被動要用過去分詞 built。"],["builded","build 的過去分詞是不規則的 built。"]],"a":[{"en":"In 1990 this bridge was built.","why":"時間放句首也可以。","bad":false}],"n":"被動語態：be 動詞 + 過去分詞，主詞是「被做」的那一方。"},{"t":"pass","l":2,"zh":"英文在許多國家被使用。","en":"English is spoken in many countries.","d":[["speaks","英文是「被說」，要用被動 is spoken。"],["spoke","be 動詞後面接過去分詞 spoken，不是過去式 spoke。"],["country","many 後面接複數 countries。"]],"a":[{"en":"In many countries English is spoken.","why":"地點放句首也可以，但比較不自然。","bad":false}],"n":"speak 三態：speak - spoke - spoken。"},{"t":"pass","l":2,"zh":"會議被延到下週了。","en":"The meeting has been postponed until next week.","d":[["postponing","被延期是被動，用過去分詞 postponed。"],["have","the meeting 是單數，用 has。"],["be","has 後面接過去分詞 been。"]],"a":[],"n":"現在完成式被動：has / have been + 過去分詞。"},{"t":"pass","l":2,"zh":"你的訂單明天會被寄出。","en":"Your order will be shipped tomorrow.","d":[["ship","will be 後面接過去分詞 shipped。"],["is","will 後面接原形 be。"],["you","「你的訂單」要用所有格 your。"]],"a":[{"en":"Tomorrow your order will be shipped.","why":"時間放句首也可以。","bad":false}],"n":"未來式被動：will be + 過去分詞。"},{"t":"pass","l":2,"zh":"這些產品是在台灣製造的。","en":"These products are made in Taiwan.","d":[["is","these products 是複數，用 are。"],["make","被動要用過去分詞 made。"],["product","these 後面接複數 products。"]],"a":[],"n":"be made in + 地點：在某地製造。"},{"t":"pass","l":2,"zh":"窗戶被風吹破了。","en":"The window was broken by the wind.","d":[["broke","be 動詞後面接過去分詞 broken。"],["breaks","被動要用過去分詞 broken。"],["were","the window 是單數，用 was。"]],"a":[],"n":"by + 動作執行者。break 三態：break - broke - broken。"},{"t":"pass","l":2,"zh":"吸菸在這裡是被禁止的。","en":"Smoking is not allowed here.","d":[["allow","被動要用過去分詞 allowed。"],["are","動名詞 smoking 當主詞視為單數，用 is。"],["allowing","被動要用過去分詞 allowed。"]],"a":[],"n":"動名詞當主詞時，動詞用單數。"},{"t":"pass","l":2,"zh":"那位新員工被要求參加訓練。","en":"The new employee was asked to attend the training.","d":[["asking","被要求是被動，用 was asked。"],["attending","to 後面接原形 attend。"],["were","the new employee 是單數，用 was。"]],"a":[],"n":"be asked to + 原形動詞：被要求做某事。"},{"t":"rel","l":2,"zh":"我有一個住在倫敦的朋友。","en":"I have a friend who lives in London.","d":[["live","who 指 a friend（單數），動詞用 lives。"],["which","先行詞是人，用 who，不用 which。"],["has","主詞 I 用 have。"]],"a":[],"n":"關係代名詞：人用 who，物用 which，兩者都可以用 that。"},{"t":"rel","l":2,"zh":"這是我昨天買的書。","en":"This is the book that I bought yesterday.","d":[["buy","yesterday 是過去，用過去式 bought。"],["who","先行詞 the book 是物，不能用 who。"],["books","the book 指一本，用單數。"]],"a":[],"n":"the book (that) I bought：that 在子句中當受詞，可以省略。"},{"t":"rel","l":2,"zh":"幫助我的那個人是一位醫生。","en":"The man who helped me was a doctor.","d":[["helps","事情發生在過去，用 helped。"],["I","help 後面接受格 me。"],["were","the man 是單數，用 was。"]],"a":[],"n":"關係子句放在先行詞後面修飾它。"},{"t":"rel","l":2,"zh":"我們住的那間飯店很舒服。","en":"The hotel where we stayed was very comfortable.","d":[["stay","住過的飯店是過去的事，用 stayed。"],["who","hotel 不是人，不能用 who。"],["comfortably","be 動詞後面接形容詞 comfortable。"]],"a":[],"n":"where = in / at which，用來修飾地點。"},{"t":"rel","l":2,"zh":"她是我最欣賞的老師。","en":"She is the teacher whom I admire most.","d":[["admires","子句主詞是 I，動詞用 admire。"],["which","teacher 是人，不能用 which。"],["her","句子開頭的主詞要用主格 she。"]],"a":[],"n":"whom 是 who 的受格，在子句中當受詞；口語常用 who 或直接省略。"},{"t":"rel","l":2,"zh":"我要的那份檔案在哪裡？","en":"Where is the file that I need?","d":[["needs","子句主詞是 I，動詞用 need。"],["are","the file 是單數，用 is。"],["files","the file 指一份，用單數。"]],"a":[],"n":"關係代名詞當受詞時常可省略：the file (that) I need。"},{"t":"rel","l":2,"zh":"我認識一個爸爸是飛行員的女孩。","en":"I know a girl whose father is a pilot.","d":[["who","「她的爸爸」要用所有格 whose。"],["her","連接兩個子句要用關係代名詞 whose，不能用 her。"],["knows","主詞 I 用 know。"]],"a":[],"n":"whose + 名詞：誰的…。"},{"t":"cond","l":2,"zh":"如果明天下雨，我們就待在家。","en":"If it rains tomorrow, we will stay home.","d":[["rain","it 是第三人稱單數，用 rains。"],["stayed","will 後面接原形 stay。"],["rained","第一類條件句的 if 子句用現在式 rains 表示未來。"]],"a":[{"en":"We will stay home if it rains tomorrow.","why":"把 if 子句放後面也對；放前面時中間要加逗號，放後面就不用。","bad":false}],"n":"第一類條件句：If + 現在式, 主詞 + will + 原形動詞（真實可能發生的事）。"},{"t":"cond","l":2,"zh":"如果你需要幫忙，打給我。","en":"If you need help, call me.","d":[["needs","主詞 you 用 need。"],["calling","祈使句用原形動詞 call。"],["I","call 後面接受格 me。"]],"a":[{"en":"Call me if you need help.","why":"祈使句放前面也對，口語很常這樣說。","bad":false}],"n":"If 子句 + 祈使句也很常見。"},{"t":"cond","l":2,"zh":"如果我是你，我會接受那份工作。","en":"If I were you, I would take the job.","d":[["am","與現在事實相反的假設，be 動詞用 were。"],["will","假設語氣的主要子句用 would。"],["took","would 後面接原形 take。"]],"a":[{"en":"I would take the job if I were you.","why":"子句對調也對。","bad":false}],"n":"第二類條件句：If + 過去式, 主詞 + would + 原形動詞（與現在事實相反）。"},{"t":"cond","l":2,"zh":"如果我有更多時間，我會學日文。","en":"If I had more time, I would learn Japanese.","d":[["have","與現在事實相反，if 子句用過去式 had。"],["learned","would 後面接原形 learn。"],["much","「更多時間」要用比較級 more。"]],"a":[{"en":"I would learn Japanese if I had more time.","why":"子句對調也對。","bad":false}],"n":"現在其實沒有更多時間，所以用過去式表示假設。"},{"t":"cond","l":2,"zh":"除非你努力，否則你不會成功。","en":"You won't succeed unless you work hard.","d":[["succeeds","won't 後面接原形 succeed。"],["works","主詞 you 用 work。"],["hardly","「努力」是 work hard；hardly 是「幾乎不」。"]],"a":[{"en":"Unless you work hard you won't succeed.","why":"unless 子句放前面也對，寫的時候中間加逗號。","bad":false}],"n":"unless = if...not。unless 子句用現在式表示未來。"},{"t":"cond","l":2,"zh":"如果你加熱冰，它會融化。","en":"If you heat ice, it melts.","d":[["melted","描述事實的零條件句，用現在式 melts。"],["melt","it 是第三人稱單數，用 melts。"],["heats","主詞 you 用 heat。"]],"a":[{"en":"It melts if you heat ice.","why":"文法上也對，但 it 先出現、ice 後出現，讀的人不知道 it 指什麼，所以標準答案把 if 子句放前面。","bad":false}],"n":"零條件句：If + 現在式, 現在式（科學事實、必然結果）。"},{"t":"cond","l":2,"zh":"萬一你有任何問題，請跟我聯絡。","en":"If you have any questions, please contact me.","d":[["has","主詞 you 用 have。"],["contacting","please 後面接原形 contact。"],["question","any 在這裡接複數 questions。"]],"a":[{"en":"Please contact me if you have any questions.","why":"子句對調也對，商用 email 很常這樣寫。","bad":false}],"n":"any 常用在疑問、否定和 if 子句中。"},{"t":"indq","l":2,"zh":"你知道車站在哪裡嗎？","en":"Do you know where the station is?","d":[["does","主詞是 you，用 Do。"],["are","the station 是單數，用 is。"],["knows","do 後面接原形 know。"]],"a":[{"en":"Do you know where is the station?","why":"間接問句要用直述語序：where the station is，不能倒裝成 where is the station。","bad":true}],"n":"間接問句：疑問詞 + 主詞 + 動詞（不倒裝）。"},{"t":"indq","l":2,"zh":"請告訴我會議幾點開始。","en":"Please tell me what time the meeting starts.","d":[["start","the meeting 是單數，動詞用 starts。"],["does","間接問句不用 does。"],["I","tell 後面接受格 me。"]],"a":[],"n":"間接問句裡不用 do / does / did。"},{"t":"indq","l":2,"zh":"我不知道他為什麼生氣。","en":"I don't know why he is angry.","d":[["doesn't","主詞 I 用 don't。"],["angrily","be 動詞後面接形容詞 angry。"],["him","子句的主詞要用主格 he。"]],"a":[{"en":"I don't know why is he angry.","why":"間接問句要用直述語序：why he is angry。","bad":true}],"n":"why he is angry 是名詞子句，當 know 的受詞。"},{"t":"indq","l":2,"zh":"你可以告訴我這個多少錢嗎？","en":"Could you tell me how much this costs?","d":[["cost","this 是單數，動詞用 costs。"],["does","間接問句不用 does。"],["I","tell 後面接受格 me。"]],"a":[],"n":"Could you tell me + 疑問詞 + 主詞 + 動詞？"},{"t":"indq","l":2,"zh":"我想知道你是否有空。","en":"I wonder if you are free.","d":[["is","主詞 you 用 are。"],["wonders","主詞 I 用 wonder。"],["freely","be 動詞後面接形容詞 free。"]],"a":[{"en":"I wonder if are you free.","why":"if 後面要用直述語序：you are。","bad":true}],"n":"if / whether 引導「是否」的間接問句。"},{"t":"indq","l":2,"zh":"你記得我把鑰匙放在哪裡嗎？","en":"Do you remember where I put my keys?","d":[["putted","put 的過去式還是 put。"],["me","子句主詞要用主格 I。"],["remembers","do 後面接原形 remember。"]],"a":[],"n":"put 三態都是 put。"},{"t":"ger","l":2,"zh":"我喜歡在週末游泳。","en":"I enjoy swimming on weekends.","d":[["swim","enjoy 後面接動名詞 swimming。"],["swam","enjoy 後面接動名詞。"],["enjoys","主詞 I 用 enjoy。"]],"a":[{"en":"On weekends I enjoy swimming.","why":"時間放句首也可以。","bad":false}],"n":"enjoy / finish / mind / avoid / keep 後面接 V-ing。"},{"t":"ger","l":2,"zh":"她決定換工作。","en":"She decided to change jobs.","d":[["changing","decide 後面接 to + 原形動詞。"],["decide","主詞 she 是單數，而且是已經做的決定，用 decided。"],["changed","to 後面接原形 change。"]],"a":[],"n":"decide / want / hope / plan / agree 後面接 to + 原形動詞。"},{"t":"ger","l":2,"zh":"你介意等一下嗎？","en":"Do you mind waiting for a moment?","d":[["wait","mind 後面接動名詞 waiting。"],["minds","do 後面接原形 mind。"],["waited","mind 後面接動名詞。"]],"a":[],"n":"Do you mind + V-ing? 客氣地請對方做某事。"},{"t":"ger","l":2,"zh":"我期待見到你。","en":"I look forward to seeing you.","d":[["see","look forward to 的 to 是介系詞，後面接 V-ing。"],["looks","主詞 I 用 look。"],["saw","to 在這裡是介系詞，後面接 V-ing。"]],"a":[],"n":"look forward to / be used to 的 to 是介系詞，後面接 V-ing。"},{"t":"ger","l":2,"zh":"他停下來喝咖啡。","en":"He stopped to drink some coffee.","d":[["drinking","stop drinking 是「戒掉、停止喝」；「停下來去喝」要用 stop to drink。"],["stops","事情發生在過去，用 stopped。"],["drank","to 後面接原形 drink。"]],"a":[],"n":"stop + V-ing：停止做某事；stop + to V：停下來去做另一件事。"},{"t":"ger","l":2,"zh":"學習英文需要時間。","en":"Learning English takes time.","d":[["Learn","當主詞要用動名詞 learning。"],["take","動名詞當主詞視為單數，用 takes。"],["Learned","當主詞要用動名詞 learning。"]],"a":[],"n":"動名詞可以當主詞，動詞用單數。"},{"t":"ger","l":2,"zh":"我忘記鎖門了。","en":"I forgot to lock the door.","d":[["locking","forget doing 是「忘了做過」；這裡是「忘了去做」，用 to lock。"],["forgets","主詞 I 不加 s，而且是過去的事，用 forgot。"],["locked","to 後面接原形 lock。"]],"a":[],"n":"forget / remember + to V：忘記 / 記得要去做；+ V-ing：忘記 / 記得做過。"},{"t":"ger","l":2,"zh":"她很擅長解決問題。","en":"She is good at solving problems.","d":[["solve","介系詞 at 後面接動名詞 solving。"],["well","be 動詞後面接形容詞 good。"],["problem","這裡泛指問題，用複數 problems。"]],"a":[],"n":"介系詞後面要接名詞或 V-ing。"},{"t":"conj","l":2,"zh":"雖然下雨，我們還是去了。","en":"Although it was raining, we still went.","d":[["rained","was 後面要接 raining（過去進行式）。"],["go","事情發生在過去，用 went。"],["were","主詞 it 用 was。"]],"a":[{"en":"We still went although it was raining.","why":"子句對調也對。","bad":false}],"n":"although + 子句；despite / in spite of + 名詞或 V-ing。"},{"t":"conj","l":2,"zh":"因為塞車，我遲到了。","en":"I was late because of the traffic.","d":[["lately","be 動詞後面接形容詞 late；lately 是「最近」。"],["am","事情發生在過去，用 was。"],["traffics","traffic 是不可數名詞，不加 s。"]],"a":[{"en":"Because of the traffic I was late.","why":"原因放句首也對，寫的時候中間加逗號。","bad":false}],"n":"because + 子句；because of + 名詞。"},{"t":"conj","l":2,"zh":"他很累，所以早早上床睡覺。","en":"He was tired, so he went to bed early.","d":[["tiring","人覺得累用 tired；tiring 是「令人疲累的」。"],["go","事情發生在過去，用 went。"],["him","so 後面子句的主詞要用主格 he。"]],"a":[],"n":"so 表示結果；because 表示原因。"},{"t":"conj","l":2,"zh":"你可以喝茶或咖啡。","en":"You can have tea or coffee.","d":[["has","can 後面接原形 have。"],["having","can 後面接原形 have。"],["had","can 後面接原形 have。"]],"a":[{"en":"You can have coffee or tea.","why":"茶和咖啡對調也對，只是中文先說茶。","bad":false}],"n":"or = 或；and = 和。"},{"t":"conj","l":2,"zh":"我一到家就打給你。","en":"I will call you as soon as I get home.","d":[["got","時間子句用現在式 get 表示未來。"],["calls","will 後面接原形 call。"],["gets","主詞 I 用 get。"]],"a":[{"en":"As soon as I get home I will call you.","why":"子句對調也對，寫的時候中間加逗號。","bad":false}],"n":"as soon as / when / before / after 引導的時間子句，用現在式代替未來式。"},{"t":"conj","l":2,"zh":"她不但聰明而且很勤奮。","en":"She is not only smart but also hardworking.","d":[["smartly","be 動詞後面接形容詞 smart。"],["are","主詞 she 用 is。"],["smarter","這裡沒有比較，用原級 smart。"]],"a":[],"n":"not only A but also B：不但 A 而且 B。"},{"t":"conj","l":2,"zh":"在你離開之前，請關燈。","en":"Before you leave, please turn off the lights.","d":[["leaving","you 是主詞，後面接動詞 leave。"],["left","時間子句用現在式表示未來。"],["light","the lights 指房間裡所有的燈，用複數。"]],"a":[{"en":"Please turn off the lights before you leave.","why":"子句對調也對。","bad":false},{"en":"Before you leave please turn the lights off.","why":"turn off the lights 和 turn the lights off 都對。","bad":false},{"en":"Please turn the lights off before you leave.","why":"子句對調、受詞放中間都對。","bad":false}],"n":"時間子句不用 will；turn off + 名詞，名詞也可以放在 turn 和 off 中間。"},{"t":"caus","l":2,"zh":"我請人修了我的車。","en":"I had my car repaired.","d":[["repair","請別人做，用 have + 物 + 過去分詞。"],["repairing","車是「被修」，用過去分詞 repaired。"],["me","「我的車」要用所有格 my。"]],"a":[],"n":"have / get + 物 + 過去分詞：請人把某物處理好。"},{"t":"caus","l":2,"zh":"我媽媽讓我自己做決定。","en":"My mom lets me make my own decisions.","d":[["let","my mom 是第三人稱單數，用 lets。"],["making","let + 人 + 原形動詞。"],["I","let 後面接受格 me。"]],"a":[],"n":"let + 人 + 原形動詞：讓某人做某事。"},{"t":"caus","l":2,"zh":"老闆叫我們加班。","en":"The boss made us work overtime.","d":[["working","make + 人 + 原形動詞。"],["we","made 後面接受格 us。"],["worked","make + 人 + 原形動詞。"]],"a":[],"n":"make + 人 + 原形動詞：迫使某人做某事。"},{"t":"caus","l":2,"zh":"我請他幫我翻譯這封信。","en":"I got him to translate the letter.","d":[["translated","get + 人 + to + 原形動詞。"],["he","got 後面接受格 him。"],["translating","to 後面接原形 translate。"]],"a":[],"n":"get + 人 + to V：說服、請某人做某事。"},{"t":"caus","l":2,"zh":"這部電影讓我覺得很難過。","en":"The movie made me feel sad.","d":[["feeling","make 後面接原形動詞 feel。"],["sadly","feel 後面接形容詞 sad。"],["felt","make + 人 + 原形動詞。"]],"a":[],"n":"感官動詞 feel / look / sound 後面接形容詞。"},{"t":"caus","l":2,"zh":"她去剪頭髮了。","en":"She got her hair cut.","d":[["cutting","頭髮是「被剪」，用過去分詞 cut。"],["cuts","get + 物 + 過去分詞。"],["hairs","頭髮整體是不可數，用 hair。"]],"a":[],"n":"get one's hair cut：（請人）剪頭髮。cut 的三態都是 cut。"},{"t":"caus","l":2,"zh":"我幫媽媽打掃房子。","en":"I helped my mom clean the house.","d":[["cleaning","help + 人 + 原形動詞。"],["helps","事情發生在過去，用 helped。"],["cleaned","help + 人 + 原形動詞。"]],"a":[],"n":"help + 人 + (to) 原形動詞。"},{"t":"pastp","l":3,"zh":"我到的時候，電影已經開始了。","en":"When I arrived, the movie had already started.","d":[["has","在過去某個時間點之前就完成的事，用過去完成式 had。"],["start","had 後面接過去分詞 started。"],["arrive","when 子句說的是過去，用 arrived。"]],"a":[{"en":"The movie had already started when I arrived.","why":"子句對調也對。","bad":false}],"n":"過去完成式：had + 過去分詞，表示「過去的過去」。"},{"t":"pastp","l":3,"zh":"那次旅行之前，她從沒搭過飛機。","en":"Before that trip, she had never flown.","d":[["flew","had 後面接過去分詞 flown。"],["fly","had 後面接過去分詞 flown。"],["trips","that 後面接單數 trip。"]],"a":[{"en":"She had never flown before that trip.","why":"子句對調也對。","bad":false}],"n":"fly 三態：fly - flew - flown。"},{"t":"pastp","l":3,"zh":"我們到車站時，火車已經開走了。","en":"By the time we got to the station, the train had left.","d":[["leaved","leave 的過去分詞是不規則的 left。"],["get","by the time 子句說的是過去，用 got。"],["leaving","had 後面接過去分詞 left。"]],"a":[{"en":"The train had left by the time we got to the station.","why":"子句對調也對。","bad":false}],"n":"by the time + 過去式, 主詞 + had + 過去分詞。"},{"t":"pastp","l":3,"zh":"他說他已經吃過午餐了。","en":"He said he had eaten lunch.","d":[["ate","had 後面接過去分詞 eaten。"],["says","轉述過去說的話，用 said。"],["him","子句的主詞要用主格 he。"]],"a":[],"n":"間接引述時，現在完成式會往前推成過去完成式。"},{"t":"pastp","l":3,"zh":"在我搬來台北之前，我住在高雄十年。","en":"Before I moved to Taipei, I had lived in Kaohsiung for ten years.","d":[["live","had 後面接過去分詞 lived。"],["move","事情發生在過去，用 moved。"],["year","ten 後面接複數 years。"]],"a":[{"en":"I had lived in Kaohsiung for ten years before I moved to Taipei.","why":"子句對調也對。","bad":false}],"n":"過去完成式也可以表示到過去某時為止持續的狀態。"},{"t":"pastp","l":3,"zh":"直到那時我才明白發生了什麼。","en":"Only then did I realize what had happened.","d":[["realized","did 後面接原形 realize。"],["happen","had 後面接過去分詞 happened。"],["has","發生在 realize 之前，用 had。"]],"a":[{"en":"Only then I did realize what had happened.","why":"Only then 放句首時要倒裝：did I realize。","bad":true}],"n":"Only + 時間副詞放句首時，句子要倒裝。"},{"t":"subj","l":3,"zh":"如果我早知道，我就會幫你。","en":"If I had known, I would have helped you.","d":[["knew","與過去事實相反，if 子句用 had known。"],["help","would have 後面接過去分詞 helped。"],["know","had 後面接過去分詞 known。"]],"a":[{"en":"I would have helped you if I had known.","why":"子句對調也對。","bad":false}],"n":"第三類條件句：If + had p.p., 主詞 + would have + p.p.（與過去事實相反）。"},{"t":"subj","l":3,"zh":"我真希望我會說法文。","en":"I wish I could speak French.","d":[["can","wish 表示與現在事實相反的願望，用過去式 could。"],["speaks","could 後面接原形 speak。"],["spoke","could 後面接原形 speak。"]],"a":[],"n":"I wish + 過去式：希望現在是另一種情況。"},{"t":"subj","l":3,"zh":"要是我昨天沒熬夜就好了。","en":"I wish I hadn't stayed up late last night.","d":[["stay","hadn't 後面接過去分詞 stayed。"],["didn't","對過去的遺憾，wish 後面用 hadn't + 過去分詞。"],["lately","「熬夜」是 stay up late；lately 是「最近」。"]],"a":[],"n":"I wish + had p.p.：後悔過去做了（或沒做）某事。"},{"t":"subj","l":3,"zh":"要是沒有你的幫忙，我就失敗了。","en":"Without your help, I would have failed.","d":[["fail","would have 後面接過去分詞 failed。"],["will","與過去事實相反，用 would。"],["you","「你的幫忙」要用所有格 your。"]],"a":[{"en":"I would have failed without your help.","why":"對調也對。","bad":false}],"n":"Without... 常搭配假設語氣，意思是「要不是…」。"},{"t":"subj","l":3,"zh":"是時候該睡覺了。","en":"It's time we went to bed.","d":[["go","It's time + 主詞 + 過去式，表示「早該做了」。"],["going","子句裡要有過去式動詞 went。"],["us","子句的主詞要用主格 we。"]],"a":[],"n":"It's time + 主詞 + 過去式動詞：早就該…了。"},{"t":"subj","l":3,"zh":"他說話的樣子好像他是老闆。","en":"He talks as if he were the boss.","d":[["be","as if 後面的子句要有變化過的動詞，be 要變成 were。"],["is","他其實不是老闆，要用假設語氣 were。"],["talk","主詞 he 用 talks。"]],"a":[],"n":"as if / as though + 過去式：好像…（其實不是）。口語也常聽到 as if he was。"},{"t":"subj","l":3,"zh":"老師建議他每天練習。","en":"The teacher suggested that he practice every day.","d":[["practices","suggest that 後面的子句用原形動詞（should 省略）。"],["practiced","suggest that 子句用原形動詞，不用過去式。"],["him","that 子句的主詞要用主格 he。"]],"a":[],"n":"suggest / recommend / insist / require that + 主詞 + (should) + 原形動詞。"},{"t":"subj","l":3,"zh":"如果他當時聽我的話，他現在就不會有麻煩。","en":"If he had listened to me, he wouldn't be in trouble now.","d":[["listen","與過去事實相反，用 had listened。"],["I","介系詞 to 後面接受格 me。"],["is","wouldn't 後面接原形 be。"]],"a":[{"en":"He wouldn't be in trouble now if he had listened to me.","why":"子句對調也對。","bad":false}],"n":"混合條件句：過去的條件（had p.p.）→ 現在的結果（would + 原形）。"},{"t":"part","l":3,"zh":"聽到這個消息，她哭了。","en":"Hearing the news, she started to cry.","d":[["Heard","她是主動聽到，用現在分詞 hearing。"],["Hear","分詞構句要用分詞，不能用原形。"],["her","句子的主詞要用主格 she。"]],"a":[],"n":"分詞構句：主詞相同時，把副詞子句改成 V-ing（主動）或 p.p.（被動）。"},{"t":"part","l":3,"zh":"從山頂看下去，城市很美。","en":"Seen from the mountain, the city looks beautiful.","d":[["Seeing","城市是「被看」，用過去分詞 seen。"],["beautifully","look 是連綴動詞，後面接形容詞 beautiful。"],["look","the city 是單數，用 looks。"]],"a":[],"n":"主詞是被動的一方時，分詞構句用過去分詞。"},{"t":"part","l":3,"zh":"完成工作後，他就回家了。","en":"Having finished his work, he went home.","d":[["finish","Having 後面接過去分詞 finished。"],["go","事情發生在過去，用 went。"],["him","句子的主詞要用主格 he。"]],"a":[],"n":"Having + p.p.：表示分詞的動作比主要動詞更早完成。"},{"t":"part","l":3,"zh":"因為不知道該怎麼辦，我打給了我爸。","en":"Not knowing what to do, I called my dad.","d":[["know","分詞構句要用 knowing。"],["call","事情發生在過去，用 called。"],["knew","分詞構句不用過去式。"]],"a":[],"n":"Not + V-ing：分詞構句的否定，not 放在分詞前面。"},{"t":"part","l":3,"zh":"她坐在窗邊，看著外面的雨。","en":"She sat by the window, watching the rain.","d":[["watched","表示同時進行的動作，用現在分詞 watching。"],["watch","這裡需要分詞 watching。"],["sit","事情發生在過去，用 sat。"]],"a":[],"n":"主要動作 + , + V-ing：表示伴隨的動作。"},{"t":"part","l":3,"zh":"這本書是用簡單的英文寫的，適合初學者。","en":"Written in simple English, the book is good for beginners.","d":[["Writing","書是「被寫」，用過去分詞 written。"],["Wrote","分詞構句不用過去式。"],["beginner","這裡泛指初學者，用複數 beginners。"]],"a":[],"n":"被動意義的分詞構句用過去分詞開頭。"},{"t":"inv","l":3,"zh":"我從來沒見過這麼美的景色。","en":"Never have I seen such a beautiful view.","d":[["saw","have 後面接過去分詞 seen。"],["has","主詞 I 用 have。"],["beautifully","修飾名詞 view 要用形容詞 beautiful。"]],"a":[{"en":"Never I have seen such a beautiful view.","why":"Never 放句首時要倒裝：have I seen。","bad":true}],"n":"否定副詞（Never / Rarely / Seldom / Hardly）放句首時，助動詞移到主詞前。"},{"t":"inv","l":3,"zh":"我一到家，電話就響了。","en":"No sooner had I got home than the phone rang.","d":[["get","had 後面接過去分詞 got。"],["rings","事情發生在過去，用 rang。"],["ring","事情發生在過去，用 rang。"]],"a":[{"en":"No sooner I had got home than the phone rang.","why":"No sooner 放句首時要倒裝：had I got。","bad":true}],"n":"No sooner had + 主詞 + p.p. + than + 過去式：一…就…。"},{"t":"inv","l":3,"zh":"我很少在週末工作。","en":"Rarely do I work on weekends.","d":[["works","do 後面接原形 work。"],["does","主詞 I 用 do。"],["working","do 後面接原形 work。"]],"a":[{"en":"Rarely I do work on weekends.","why":"Rarely 放句首時要倒裝：do I work。","bad":true}],"n":"Rarely / Seldom 放句首，加 do / does / did 倒裝。"},{"t":"inv","l":3,"zh":"只有努力，你才能成功。","en":"Only by working hard can you succeed.","d":[["work","介系詞 by 後面接動名詞 working。"],["succeeds","can 後面接原形 succeed。"],["hardly","「努力」是 work hard；hardly 是「幾乎不」。"]],"a":[{"en":"Only by working hard you can succeed.","why":"Only + 片語放句首時，主要子句要倒裝：can you succeed。","bad":true}],"n":"Only + 副詞片語放句首 → 主要子句倒裝。"},{"t":"inv","l":3,"zh":"我不僅忘了帶錢包，還忘了帶手機。","en":"Not only did I forget my wallet, but I also forgot my phone.","d":[["forgetting","did 後面接原形 forget。"],["me","句子的主詞要用主格 I。"],["wallets","my wallet 只有一個，用單數。"]],"a":[{"en":"Not only I did forget my wallet, but I also forgot my phone.","why":"Not only 放句首時要倒裝：did I forget。","bad":true}],"n":"Not only 放句首時，第一個子句要倒裝。"},{"t":"inv","l":3,"zh":"直到午夜他才回來。","en":"Not until midnight did he come back.","d":[["came","did 後面接原形 come。"],["comes","did 後面接原形 come。"],["him","句子的主詞要用主格 he。"]],"a":[{"en":"Not until midnight he did come back.","why":"Not until 放句首時，主要子句要倒裝：did he come back。","bad":true}],"n":"Not until + 時間 + 倒裝句：直到…才…。"},{"t":"cleft","l":3,"zh":"是約翰昨天打電話給我的。","en":"It was John who called me yesterday.","d":[["call","事情發生在過去，用 called。"],["I","call 後面接受格 me。"],["were","主詞 it 搭配 was。"]],"a":[],"n":"強調句：It is / was + 被強調的部分 + that / who + 其餘。"},{"t":"cleft","l":3,"zh":"我們需要的是更多時間。","en":"What we need is more time.","d":[["are","What 子句當主詞視為單數，用 is。"],["needs","主詞 we 用 need。"],["much","「更多時間」用比較級 more。"]],"a":[{"en":"More time is what we need.","why":"這樣也對，是把 more time 放前面當主詞；標準答案用 What 開頭來強調「我們需要的東西」。","bad":false}],"n":"What + 主詞 + 動詞 + is + 名詞：…的是…。"},{"t":"cleft","l":3,"zh":"就是在台北我第一次遇見她。","en":"It was in Taipei that I first met her.","d":[["meet","事情發生在過去，用 met。"],["she","met 後面接受格 her。"],["were","主詞 it 搭配 was。"]],"a":[],"n":"強調地點時，仍然用 It was + 地點 + that。"},{"t":"cleft","l":3,"zh":"讓我驚訝的是他的誠實。","en":"What surprised me was his honesty.","d":[["surprising","What 子句裡需要動詞，用過去式 surprised。"],["were","his honesty 是單數，用 was。"],["honest","his 後面要接名詞 honesty；honest 是形容詞。"]],"a":[{"en":"His honesty was what surprised me.","why":"這樣也對；標準答案把 What 子句放前面，強調效果比較好。","bad":false}],"n":"What 引導的名詞子句可以放在句首強調。"},{"t":"cleft","l":3,"zh":"直到他離開，我才意識到我多想念他。","en":"It wasn't until he left that I realized how much I missed him.","d":[["leave","事情發生在過去，用 left。"],["realize","事情發生在過去，用 realized。"],["miss","過去的感受，用 missed。"]],"a":[],"n":"It was not until + 時間 + that + 主要子句：直到…才…。"},{"t":"noun","l":3,"zh":"他是否會來還不確定。","en":"Whether he will come is still uncertain.","d":[["are","名詞子句當主詞視為單數，用 is。"],["comes","will 後面接原形 come。"],["uncertainly","be 動詞後面接形容詞 uncertain。"]],"a":[],"n":"名詞子句當主詞時用 whether，不用 if；動詞用單數。"},{"t":"noun","l":3,"zh":"事實是我們需要更多錢。","en":"The fact is that we need more money.","d":[["needs","主詞 we 用 need。"],["are","the fact 是單數，用 is。"],["facts","the fact 是單數。"]],"a":[],"n":"that 引導名詞子句時，子句本身是完整句。"},{"t":"noun","l":3,"zh":"我不同意他說的話。","en":"I don't agree with what he said.","d":[["says","過去說的話，用 said。"],["him","子句的主詞要用主格 he。"],["agrees","don't 後面接原形 agree。"]],"a":[],"n":"what = the thing(s) that，子句中缺受詞時用 what。"},{"t":"noun","l":3,"zh":"重要的是你要盡力。","en":"What matters is that you do your best.","d":[["matter","What 子句當主詞視為單數，動詞用 matters。"],["does","主詞 you 用 do。"],["are","What 子句當主詞視為單數，用 is。"]],"a":[],"n":"What matters is that...：重要的是…。"},{"t":"noun","l":3,"zh":"我很驚訝他這麼快就完成了。","en":"I'm surprised that he finished so quickly.","d":[["quick","修飾動詞 finished 要用副詞 quickly。"],["surprising","人感到驚訝用 surprised。"],["finish","事情發生在過去，用 finished。"]],"a":[],"n":"be + 形容詞 + that 子句：對…感到…。"},{"t":"noun","l":3,"zh":"誰贏得比賽對我來說不重要。","en":"Who wins the game doesn't matter to me.","d":[["win","Who 是子句的主詞，動詞用 wins。"],["don't","名詞子句當主詞視為單數，用 doesn't。"],["I","介系詞 to 後面接受格 me。"]],"a":[],"n":"疑問詞引導的名詞子句可以當主詞。"},{"t":"passadv","l":3,"zh":"據說他是一位很有名的作家。","en":"He is said to be a famous writer.","d":[["says","「據說」要用被動 is said。"],["being","to 後面接原形 be。"],["fame","修飾 writer 要用形容詞 famous。"]],"a":[],"n":"主詞 + be said to + V：據說…。"},{"t":"passadv","l":3,"zh":"這個問題應該早就被解決了。","en":"This problem should have been solved earlier.","d":[["solve","been 後面接過去分詞 solved。"],["has","should 後面接原形 have。"],["being","完成式被動是 have been，不是 being。"]],"a":[],"n":"情態助動詞 + have been + p.p.：本來應該已被…（但沒有）。"},{"t":"passadv","l":3,"zh":"新的工廠正在被建造中。","en":"The new factory is being built.","d":[["building","工廠是被建造，用被動進行式 is being built。"],["been","進行式被動用 being，不是 been。"],["build","被動要用過去分詞 built。"]],"a":[],"n":"進行式被動：am / is / are being + 過去分詞。"},{"t":"passadv","l":3,"zh":"所有的表格都必須在週五前提交。","en":"All forms must be submitted by Friday.","d":[["submit","must be 後面接過去分詞 submitted。"],["form","all 後面接複數 forms。"],["submitting","被動要用過去分詞 submitted。"]],"a":[],"n":"情態助動詞被動：must / should / can + be + 過去分詞。"},{"t":"passadv","l":3,"zh":"有人看到他走進那棟大樓。","en":"He was seen to enter the building.","d":[["saw","他是「被看到」，用被動 was seen。"],["entered","to 後面接原形 enter。"],["him","句子的主詞要用主格 he。"]],"a":[],"n":"主動 see someone do → 被動 be seen to do。也可以說 He was seen entering the building。"},{"t":"passadv","l":3,"zh":"這座城市被認為是全世界最安全的城市之一。","en":"The city is considered one of the safest cities in the world.","d":[["considers","城市是「被認為」，用被動 is considered。"],["safer","one of the 後面接最高級 safest。"],["safe","one of the 後面接最高級 safest。"]],"a":[],"n":"one of the + 最高級 + 複數名詞：最…的之一。"},{"t":"relx","l":3,"zh":"我還記得我們第一次見面的那天。","en":"I still remember the day when we first met.","d":[["meet","事情發生在過去，用 met。"],["remembers","主詞 I 用 remember。"],["us","子句的主詞要用主格 we。"]],"a":[],"n":"when = on / in which，修飾時間。"},{"t":"relx","l":3,"zh":"這就是我辭職的原因。","en":"That is the reason why I quit my job.","d":[["reasons","the reason 是單數。"],["me","子句的主詞要用主格 I。"],["are","主詞 that 是單數，用 is。"]],"a":[],"n":"why = for which，修飾 reason。quit 的三態都是 quit。"},{"t":"relx","l":3,"zh":"我的哥哥住在美國，他是醫生。","en":"My brother, who lives in the US, is a doctor.","d":[["live","who 指 my brother，動詞用 lives。"],["are","my brother 是單數，用 is。"],["whom","who 在子句裡當主詞，不能用受格 whom。"]],"a":[],"n":"非限定關係子句：前後有逗點，補充說明，不能用 that。"},{"t":"relx","l":3,"zh":"他沒通過考試，這讓他父母很失望。","en":"He failed the exam, which disappointed his parents.","d":[["fails","事情發生在過去，用 failed。"],["disappoint","事情發生在過去，用 disappointed。"],["disappointing","which 後面需要動詞，用過去式 disappointed。"]],"a":[],"n":", which 可以指前面整個句子。"},{"t":"relx","l":3,"zh":"這是我出生的城市。","en":"This is the city in which I was born.","d":[["where","介系詞 in 後面不能接 where，要用 which。"],["am","出生是過去的事，用 was。"],["bear","be born 是固定說法，要用 born。"]],"a":[{"en":"This is the city which I was born in.","why":"這樣也對，介系詞放句尾比較口語；標準答案把 in 放在 which 前面，比較正式。","bad":false}],"n":"介系詞 + which = where（用於地點）。"},{"t":"relx","l":3,"zh":"我有兩個哥哥，兩個都是工程師。","en":"I have two brothers, both of whom are engineers.","d":[["who","介系詞 of 後面要用受格 whom。"],["is","both 指兩個人，用 are。"],["engineer","兩個人，用複數 engineers。"]],"a":[],"n":"數量詞 + of whom / which：…其中的…。"}];

function newQ(){
  if(gs.i>=gs.ids.length){gs.cur=null;return}
  if(gs.states[gs.i]){gs.cur=gs.states[gs.i];return}
  const g=GBY.get(gs.ids[gs.i]);if(!g){gs.cur=null;return}
  // each sentence has 3 word-form decoys; show 2 or 3 of them at random
  const dd=shuffle(g.dd).slice(0,Math.random()<0.5?2:3);
  const tiles=shuffle(g.toks.concat(dd.map(x=>x[0])));
  gs.cur=gs.states[gs.i]={dd,tiles,placed:[],wrong:false,revealed:false,done:false,err:null,ok:false,alt:null};
}
function gRecord(id,s){const r=S.G.r[id]||(S.G.r[id]={n:0});r.n=(r.n||0)+1;r.s=s;r.t=today();save()}
function gCheck(){
  const g=GBY.get(gs.ids[gs.i]),c=gs.cur;if(c.done)return;
  const exp=g.toks,got=c.placed.map(k=>c.tiles[k]);
  if(!got.length){toast("先點下面的字塊組成句子");return}
  c.checked=true;
  const gotS=got.join(" "),alt=g.alts.find(a=>a.toks.join(" ")===gotS);
  if(gotS===exp.join(" ")||(alt&&!alt.bad)){
    c.done=true;c.ok=true;c.alt=alt||null;const res=c.wrong?"w":"c";gs.res[g.id]=res;
    const prev=gStatus(g.id);gRecord(g.id,res);
    c.msg=(alt?"這樣排也對！":"")+(res==="c"?(prev==="w"?"一次全對！這題已經從「不會」移到「答對」。":"一次全對！"):"句子正確。因為這題有錯過，先放在「不會」，之後複習一次全對就會移到「答對」。");
  }else{
    if(!c.wrong){c.wrong=true;gs.res[g.id]="w";gRecord(g.id,"w")}
    c.err=diffMarks(got,exp,c,alt&&alt.bad?alt:null);
  }
  render();
}
// mark only what is wrong: tiles outside the longest common subsequence are red;
// when the count is off, surplus tiles get "−" and the missing words' bank tiles get "+"
function diffMarks(got,exp,c,badAlt){
  const n=got.length,m=exp.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=got[i]===exp[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const inL=new Set(),pairs=[],mJ=new Set();for(let i=0,j=0;i<n&&j<m;){if(got[i]===exp[j]){inL.add(i);pairs.push([i,j]);mJ.add(j);i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const cnt=a=>a.reduce((o,w)=>(o[w]=(o[w]||0)+1,o),{}),cg=cnt(got),ce=cnt(exp);
  const bad=[],minus=[],plus=[];
  for(let i=0;i<n;i++)if(!inL.has(i))bad.push(i);
  // a single word swapped in place (same length) is only marked red; any other surplus/missing gets − / +
  const swap=n===m&&bad.length===1&&(()=>{const miss=Object.keys(ce).filter(w=>(ce[w]||0)>(cg[w]||0));if(miss.length!==1)return false;const t=got.slice();t[bad[0]]=miss[0];return t.join(" ")===exp.join(" ")})();
  if(!swap){
    const sur={};for(const w in cg)sur[w]=Math.max(0,cg[w]-(ce[w]||0));
    for(const i of bad.slice().reverse()){const w=got[i];if(sur[w]>0){minus.push(i);sur[w]--}}
    // where each missing word belongs: right after the last correctly placed word that comes before it
    const taken=new Set();
    for(const w in ce){const d=ce[w]-(cg[w]||0);for(let k=0;k<d;k++){
      const j=exp.findIndex((x,jj)=>x===w&&!mJ.has(jj)&&!taken.has(jj));taken.add(j);
      let pos=0;for(const [pi,pj] of pairs)if(pj<j)pos=pi+1;
      plus.push({w,pos})}}
  }
  const parts=[];
  const wrongPos=bad.filter(i=>!minus.includes(i)).length;
  if(badAlt)parts.push("用到的字都對，但順序是常見的錯誤。"+esc(badAlt.why));
  else if(wrongPos)parts.push("標紅的 "+wrongPos+" 個字位置或用字不對。");
  if(minus.length)parts.push("多了 "+minus.length+" 個字，標「−」的要拿掉。");
  if(plus.length)parts.push("少了 "+plus.length+" 個字，下面標「+」的字要放進去。");
  const used=[...new Set(bad.map(i=>got[i]))].map(w=>c.dd.find(d=>d[0]===w)).filter(Boolean);
  used.forEach(d=>parts.push("「"+esc(d[0])+"」是陷阱字："+esc(d[1])));
  return{bad,minus,plus,msg:parts.join("<br>")};
}

function backupText(){return JSON.stringify({app:"daily-english",at:new Date().toISOString(),S})}
function mergeIn(o){
  const R=normalize(o.S||o);let n=0;
  for(const id in R.p){const a=S.p[id],b=R.p[id];if(!a||((b.k||0)+(b.w||0))>((a.k||0)+(a.w||0))){S.p[id]=b;n++}}
  const have=new Set(S.custom.map(w=>w.en.toLowerCase()));R.custom.forEach(w=>{if(!have.has(w.en.toLowerCase())){S.custom.push(w);have.add(w.en.toLowerCase())}});
  for(const k of ["w","g"])Object.assign(S.fav[k],R.fav[k]||{});
  for(const id in R.G.r){const a=S.G.r[id],b=R.G.r[id];if(!a||(b.t||"")>(a.t||"")||((b.t||"")===(a.t||"")&&(b.n||0)>(a.n||0)))S.G.r[id]=b}
  for(const d in R.time){const a=S.time[d]||{},b=R.time[d];S.time[d]={v:Math.max(a.v||0,b.v||0),g:Math.max(a.g||0,b.g||0)}}
  for(const d in R.log){const a=S.log[d],b=R.log[d];if(!a||((b.k||0)+(b.u||0))>((a.k||0)+(a.u||0)))S.log[d]=b}
  for(const d in R.hist)if(!S.hist[d])S.hist[d]=R.hist[d];
  if((R.streak.last||"")>(S.streak.last||""))S.streak=R.streak;
  _idxN=-1;save();return n;
}
